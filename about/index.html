<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DAF2FC">
<meta name="description" content="고교학점제 안내 — 고교학점제란 무엇인지, 학생 주도성과 어떻게 연결되는지 알아봅니다.">
<title>고교학점제 안내 · 온마당</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  /* 시안 sub01_00 — 말풍선 카드 2장. 꼬리는 아래쪽, 캐릭터가 왼쪽 아래에 걸친다.
     둘째 칸은 시안의 --plum(흰 글자 3.9:1) 대신 --plum-d(5.6:1) — 홈 관문 카드와 같은 기준 */
  .acards{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,1.6vw,24px);margin-top:clamp(24px,2.6vw,32px)}
  .acard-item{position:relative;padding-bottom:clamp(60px,6vw,88px)}
  .acard{position:relative;display:flex;flex-direction:column;align-items:center;min-height:clamp(240px,22.6vw,325px);padding:clamp(24px,2.4vw,34px) 24px clamp(28px,3vw,44px);
    border-radius:40px;color:#fff;text-align:center;transition:transform .2s,box-shadow .2s}
  .acard::after{content:"";position:absolute;left:52%;top:100%;margin-top:-1px;border-style:solid;border-width:40px 0 0 52px;border-color:var(--card) transparent transparent transparent}
  .acard-item:nth-child(1) .acard{--card:var(--brand);background:var(--brand)}
  .acard-item:nth-child(2) .acard{--card:var(--plum-d);background:var(--plum-d)}
  a.acard:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
  a.acard:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .acard h2{font-size:clamp(21px,2vw,28px);font-weight:800;letter-spacing:-.5px;margin-bottom:clamp(12px,1.6vw,22px)}
  .acard p{font-size:clamp(15px,1.4vw,20px);line-height:1.8;word-break:keep-all;max-width:22em}
  .a-link{align-self:flex-end;margin:auto clamp(0px,2.5vw,36px) 0 0;padding-top:20px}
  .a-link > span{display:inline-block;padding:6px 18px;background:var(--surface);color:var(--ink);border-radius:12px;font-size:clamp(15px,1.3vw,18px)}
  .acard-char{position:absolute;left:clamp(0px,1vw,16px);bottom:0;width:clamp(110px,10.5vw,152px);height:auto;pointer-events:none}
  .acard-item:nth-child(2) .acard-char{left:clamp(16px,2.3vw,36px);width:clamp(100px,9.4vw,136px)}
  @media(max-width:680px){
    .acards{grid-template-columns:1fr}
    .acard{border-radius:var(--radius)}
  }
</style>
</head>
<body>

<div id="om-header" data-active="about"></div>

<!-- 페이지 헤더 -->
<div class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="이동 경로">

  </div>
</div>

<!-- 본문 -->
<main class="sub-body">
  <div class="wrap">
    <p class="sub-lead">고교학점제는 학생의 주도성을 기르는 것을 목표로 하는 교육 시스템 전환입니다.<br>아래에서 제도의 기본 개념과 학생 주도성과의 연결을 확인할 수 있습니다.</p>

    <div class="acards">
      <div class="acard-item">
        <a class="acard" href="./what-is.html">
          <h2>고교학점제란?</h2>
          <p>고교학점제의 정의와 등장 배경,<br>추진 경과를 정리했습니다.</p>
          <span class="a-link"><span>자세히 보기 <span aria-hidden="true">→</span></span></span>
        </a>
        <img class="acard-char" src="../assets/img/sub/char-panda-peek.svg" alt="" aria-hidden="true">
      </div>
      <div class="acard-item">
        <a class="acard" href="./student-agency.html">
          <h2>학생 주도성과 고교학점제</h2>
          <p>학생 주도성과 고교학점제의<br>연결을 확인할 수 있습니다.</p>
          <span class="a-link"><span>자세히 보기 <span aria-hidden="true">→</span></span></span>
        </a>
        <img class="acard-char" src="../assets/img/sub/char-rabbit-book.svg" alt="" aria-hidden="true">
      </div>
    </div>
  </div>
</main>

<div id="om-footer"></div>

        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
