let currentN = null;
let currentPageIdx = 0;
let sortMode = 'num';

const listEl = document.getElementById('course-list');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('course-count');
const viewerHeader = document.getElementById('viewer-header');
const viewerBody = document.getElementById('viewer-body');
const viewerTitleN = document.querySelector('#viewer-title .n');
const viewerSub = document.getElementById('viewer-sub');
const pageTabs = document.getElementById('page-tabs');

function pad3(n) { return String(n).padStart(3, '0'); }

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function matches(c, q) {
  if (!q) return true;
  const hay = (c.name + ' ' + c.uni + ' ' + c.code + ' ' + c.n).toLowerCase();
  return hay.indexOf(q.toLowerCase()) !== -1;
}

function sortedCourses() {
  const arr = COURSES.slice();
  if (sortMode === 'num') {
    arr.sort((a,b) => a.n - b.n);
  } else if (sortMode === 'uni') {
    arr.sort((a,b) => a.uni.localeCompare(b.uni, 'ko') || a.n - b.n);
  } else if (sortMode === 'code') {
    arr.sort((a,b) => a.code.localeCompare(b.code));
  }
  return arr;
}

function renderList() {
  const q = searchEl.value.trim();
  const arr = sortedCourses().filter(c => matches(c, q));
  listEl.innerHTML = '';

  let lastGroup = null;
  arr.forEach(c => {
    if (sortMode === 'uni') {
      if (c.uni !== lastGroup) {
        lastGroup = c.uni;
        const gl = document.createElement('li');
        gl.className = 'group-label';
        gl.textContent = c.uni;
        listEl.appendChild(gl);
      }
    }

    const li = document.createElement('li');
    li.className = 'course-item' + (c.n === currentN ? ' active' : '');
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    li.setAttribute('aria-label', c.name);
    li.innerHTML = `
      <div class="course-num">${c.n}</div>
      <div class="course-info">
        <div class="course-name">${highlight(c.name, q)}</div>
        <div class="course-meta">
          <span>${highlight(c.uni, q)}</span>
          <span class="course-code">${highlight(c.code, q)}</span>
        </div>
      </div>
      <div class="pagecount">${c.pages.length}p</div>
    `;
    li.addEventListener('click', () => selectCourse(c.n));
    li.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCourse(c.n); }
    });
    listEl.appendChild(li);
  });

  countEl.textContent = arr.length + '개 강좌' + (q ? ` (검색: "${q}")` : '');
}

function selectCourse(n) {
  currentN = n;
  currentPageIdx = 0;
  renderList();
  renderViewer();
  const activeItem = listEl.querySelector('.course-item.active');
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });
}

function renderViewer() {
  const c = COURSES.find(x => x.n === currentN);
  if (!c) return;
  viewerHeader.style.display = 'flex';
  viewerTitleN.textContent = c.name;
  viewerSub.innerHTML = c.uni + ' &nbsp;·&nbsp; <span class="code">' + c.code + '</span> &nbsp;·&nbsp; 강좌 ' + c.n;

  pageTabs.innerHTML = '';
  if (c.pages.length > 1) {
    c.pages.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'page-tab' + (i === currentPageIdx ? ' active' : '');
      btn.textContent = (i === 0 ? '명단' : (i === c.pages.length - 1 ? '출석기록' : (i+1) + '쪽'));
      btn.addEventListener('click', () => { currentPageIdx = i; renderViewer(); });
      pageTabs.appendChild(btn);
    });
  }

  const pageNum = c.pages[currentPageIdx];
  viewerBody.innerHTML = `<img src="pages/page_${pad3(pageNum)}.jpg" alt="${escapeHtml(c.name)} ${currentPageIdx+1}쪽">`;
}

searchEl.addEventListener('input', renderList);

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderList();
  });
});

document.addEventListener('keydown', (e) => {
  if (document.activeElement === searchEl) return;
  const arr = sortedCourses().filter(c => matches(c, searchEl.value.trim()));
  const idx = arr.findIndex(c => c.n === currentN);
  if (e.key === 'ArrowRight') {
    if (idx >= 0 && idx < arr.length - 1) selectCourse(arr[idx+1].n);
    else if (idx === -1 && arr.length) selectCourse(arr[0].n);
    e.preventDefault();
  } else if (e.key === 'ArrowLeft') {
    if (idx > 0) selectCourse(arr[idx-1].n);
    e.preventDefault();
  }
});

renderList();
</script>
