<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DAF2FC">
<meta name="description" content="2026학년도 여름방학 꿈키움 학교 밖 교육 출석부 열람 종료 안내 — 온마당">
<title>출석부 열람 종료 · 꿈키움 학교 밖 교육 · 온마당</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../../assets/css/common.css">
<style>
  body{display:flex;flex-direction:column;min-height:100vh}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
  .closed-card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:56px 48px;text-align:center;max-width:560px;width:100%;
  }
  .closed-icon{font-size:56px;margin-bottom:20px}
  .closed-card h1{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:14px;letter-spacing:-.4px}
  .closed-card p{font-size:15px;color:var(--ink-soft);line-height:1.8;margin-bottom:8px}
  .closed-note{
    display:block;margin-top:20px;text-align:left;
    background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:16px 20px;font-size:14px;color:var(--ink-soft);line-height:1.75;
  }
  .closed-back{
    display:inline-flex;align-items:center;gap:6px;margin-top:28px;
    font-size:14px;font-weight:700;color:var(--brand);
    padding:10px 20px;border:1.5px solid var(--brand);border-radius:var(--radius-pill);transition:.18s;
  }
  .closed-back:hover{background:var(--brand);color:#fff}

  @media(max-width:680px){
    .closed-card{padding:40px 24px}
  }
</style>
</head>
<body>

<div id="om-header" data-active="safety"></div>

<main>
  <div class="closed-card">
    <div class="closed-icon">🗂️</div>
    <h1>출석부 열람 기간이 종료되었습니다</h1>
    <p>2026학년도 여름방학 꿈키움 학교 밖 교육 창의적체험활동<br>출석부 열람은 종료되었습니다.</p>
    <span class="closed-note">
      출석부에는 학생 명단이 포함되어 있어, 열람 기간이 끝난 자료는 이 사이트에 보관하지 않습니다.
      출석 사항 확인이 필요한 경우 소속 학교의 담당 교사에게 문의하시기 바랍니다.
    </span>
    <br>
    <a class="closed-back" href="../index.html">꿈키움 학교 밖 교육 안내 보기 →</a>
    <br>
    <a class="closed-back" href="../../index.html" style="margin-top:12px">온마당 홈으로 →</a>
  </div>
</main>

<div id="om-footer"></div>
<script src="../../assets/js/common.js"></script>
<script data-goatcounter="https://onmadang.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
