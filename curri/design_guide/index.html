m/O6QKSox35xXXfa3/wCfab8qPtb/APPtN+VACaYjpp9uJU2SbBvGMfNjmrNV/tb/APPtN+VH2t/+fab8qALFFV/tb/8APtN+VH2t/wDn2m/KgCxRVf7W/wDz7TflR9rf/n2m/KgCxRVf7W//AD7TflT4Z2lYgxOnuwoAlooooA//2Q==\"><\/figure><\/li><\/ul><\/aside>"}, "com14": {"grp": "com", "num": "14", "sub": "1) 교육과정 편성", "title": "국가 교육과정에서 제시된 과목 외의 새로운 과목을 개설하는 절차는 무엇인가요?", "page": 55, "body": "<p>국가교육과정에서 제시한 과목 외의 새로운 과목(고시 외 과목)을 개설하고자 하는 경우 또는 타시도 교육감 승인 교과목(도내 타학교 승인 교과목 포함)을 사용하고자 하는 경우 <ins class=\"upd\" data-old=\"교과목 신설/사용 승인 신청서\" data-why=\"2027 지침 용어 변경(교과목 → 과목)\">과목 신설/사용 승인 신청서<\/ins>를 시행하고자 하는 학기의 5개월 전까지 교육감에게 제출해야 합니다. 자세한 절차는 충남교육청 2022 개정 교육과정 교육감 승인 과목 개설 길라잡이를 참고해 주세요.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li class=\"nm\">가. 학교에서는 본 지침에서 제시된 과목 이외에 새로운 과목을 개설할 수 있다.<\/li><li class=\"nm\">나. 학교는 새로운 과목을 설치·운영하고자 할 경우 <ins class=\"upd\" data-old=\"교과목 신설/사용 승인 신청서\" data-why=\"2027 지침 제5장 20. 용어 변경\">과목 신설/사용 승인 신청서<\/ins> 및 교과 교육과정안, 교육과정 편성안 등을 작성·제출하여 교육감의 승인을 받아야 한다.<\/li><li class=\"nm\">다. <ins class=\"upd\" data-old=\"교과목을\" data-why=\"2027 지침 용어 변경\">과목을<\/ins> 신설/사용할 때는 다음과 같은 절차를 거쳐야 한다.<ul class=\"dash\"><li class=\"nm\">1) 학교에서는 학교의 실정, 학생의 수준, 보호자의 요구 등을 반영하여 학교교육과정위원회 등을 통해 그 적합성을 심사하고, 학교운영위원회의 심의를 거쳐 <ins class=\"upd\" data-old=\"학교장이 정한다.\" data-why=\"2027 지침 제5장 20. 다. 1)\">학교장이 신청한다.<\/ins><\/li><li class=\"nm\">2) 학교장은 <ins class=\"upd\" data-old=\"교과목\" data-why=\"2027 지침 용어 변경\">과목<\/ins> 신설/사용 승인 신청서를 시행하고자 하는 학기의 5개월 전까지 교육감에게 제출한다.<\/li><li class=\"nm\">3) 교육감은 충청남도교육청 중등교육과정위원회 심의를 거쳐 <ins class=\"upd\" data-old=\"교과목\" data-why=\"2027 지침 용어 변경\">과목<\/ins> 신설/사용 승인 신청 마감 후 60일 이내에 승인 여부를 학교장에게 안내한다.<\/li><li class=\"nm\">4) <ins class=\"upd\" data-old=\"교과목\" data-why=\"2027 지침 용어 변경\">과목<\/ins> 신설/사용에 따라 교과용 도서를 개발하여 사용하거나, 인정도서를 사용할 경우 교과용 도서의 인정, 개발, 보급에 관한 사항에 따른다.<\/li><\/ul><\/li><\/ul><\/aside>\n<aside class=\"cite\"><h6>2022 개정 교육과정 교육감 승인 과목 개설 길라잡이(충청남도교육청, 2025.7.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>신설 및 사용 승인 절차(요약)<\/li><li class=\"nm\">가. 교육과정 검토 심의(신청학교)<ul class=\"dash\"><li class=\"nm\">1) 해당 교과(군)의 교과협의회 및 학교교육과정위원회 적합성 심사<\/li><li class=\"nm\">2) 교육과정 신설/사용 편성 관련 사항 학교운영위원회 심의<\/li><\/ul><\/li><li class=\"nm\">나. 과목 신설 및 사용 승인(신청학교)<ul class=\"dash\"><li class=\"nm\">1) 과목 신설 및 사용 승인 공문 발송(시행 학기 시작 5개월 전까지)<\/li><li class=\"nm\">2) 제출 서류: 신설(사용) 승인 신청서, 신설(사용) 과목 교육과정, 승인(사용) 신청 요약서, 적용 대상학년 3개년 교육과정 편성표<\/li><\/ul><\/li><li class=\"nm\">다. 과목 신설 및 사용 심의(도교육청)<ul class=\"dash\"><li class=\"nm\">1) 전문가 검토의견에 따라 수정·보완<\/li><li class=\"nm\">2) 신설(사용) 승인 결과 학교 통보<\/li><li class=\"nm\">3) 승인 교과 나이스(NEIS) 등록 및 에듀넷 탑재<\/li><\/ul><\/li><li class=\"nm\">라. 승인 과목 운영(신청학교): 교과 목표에 충실한 수업·평가·기록 실시<\/li><\/ul><\/aside>"}, "com15": {"grp": "com", "num": "15", "sub": "1) 교육과정 편성", "title": "학교 교육과정 동일 선택그룹 내 과목들의 학점들을 다르게 편성할 수 있나요?", "page": 56, "body": "<p>학교 교육과정의 선택 그룹내 과목들의 학점을 다르게 편성할 수 있습니다. 다만, 이때 동일 입학 연도 교육과정 적용 학생들 간에 해당 과목의 이수 학점이 동일 학점으로 편성되어야 합니다. 예로, OO고등학교에서 2학년 1학기에 ‘물리학’ 4학점, ‘사회와 문화’ 4학점, ‘음악과 미디어’ 3학점, ‘인간과 경제활동’ 3학점씩 동일 선택그룹으로 편성하는 것이 가능합니다. 2학년 2학기에 동일 과목을 다시 선택 과목으로 편성하기 위해서는 모두 동일 학점으로 편성해야 합니다.<\/p>"}, "com16": {"grp": "com", "num": "16", "sub": "1) 교육과정 편성", "title": "학교 교육과정 선택그룹의 학생별 선택 과목 수를 다르게 편성할 수 있나요?", "page": 56, "body": "<p>학교 교육과정의 특정 선택 그룹에서 학생들이 필요에 따라 보통의 학생들보다 많은 과목을 선택하도록 편성하는 것도 가능합니다. 다만, 해당 선택 과목을 정규 수업 시간 내에 운영하는 경우 이수 과목 수 증가에 따른 학습량 증가와 최소 성취수준 보장지도 등 공강 시간 운영 프로그램의 참여 불가 등의 상황이 발생할 수 있으므로 신중하게 선택하도록 지도해야 합니다.<\/p>"}, "com17": {"grp": "com", "num": "17", "sub": "1) 교육과정 편성", "title": "학교에서는 졸업 기준 학점을 192학점을 초과하는 것으로 설정하는 것이 가능한가요?", "page": 56, "body": "<p>2022 개정 교육과정에서는 단위학교에서 졸업의 기준을 학교규칙으로 정하도록 안내하고 있습니다. 이에 근거하여 학교의 졸업 기준 학점을 192학점을 초과한 것으로 설정할 수는 있으나, 학생의 학업 부담의 증가와 이수 학점 증가에 따른 공강 시간 운용 제한 등의 요인을 고려했을 때 바람직하다고 볼 수 없습니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>고등학교 교육과정의 총 이수 학점은 192학점이며 교과(군) 174학점, 창의적 체험활동 18학점(288시간)으로 편성한다.<\/li><li>총 이수 학점 수는 고등학교 졸업을 위해 3년간 이수해야 할 최소 이수 학점을 의미한다.<\/li><\/ul><\/aside>"}, "com18": {"grp": "com", "num": "18", "sub": "1) 교육과정 편성", "title": "특수 목적 고등학교 선택 과목을 일반고에서 편성할 때 교과(군)와 과목 유형은 어떻게 편성해야 하나요?", "page": 57, "body": "<p>2022 개정 교육과정에서 특수 목적 고등학교의 선택 과목은 2015 개정 교육과정과 다르게 교과(군)와 과목 유형이 지정되어 있습니다. 이에 따라 일반고에서 이 과목들을 편성할 때도 이 기준에 따라 편성해야 됩니다.<\/p>"}, "com19": {"grp": "com", "num": "19", "sub": "1) 교육과정 편성", "title": "특수 목적 고등학교 선택 과목을 일반고에서 편성할 때 학점 배당은 어떤 기준에 따라야 하나요?", "page": 57, "body": "<p>특수 목적 고등학교의 선택 과목을 일반고에서 편성할 경우, 일반고 기준 보통 교과 선택 과목의 기본 학점과 증감 범위를 따라야 합니다.<\/p>\n<table class=\"t mini\"><caption>일반고등학교의 특수 목적 고등학교 선택 과목 편성 시 기본 학점 및 증감 범위<\/caption><thead><tr><th>과목 구분<\/th><th>과목<\/th><th>기본 학점<\/th><th>편성·운영 범위<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td rowspan=\"2\">〈표2〉<\/td><td>과학, 외국어·국제 계열 선택 과목<\/td><td>4학점<\/td><td>3∼5학점<\/td><td rowspan=\"2\">1학점 내 증감(±) 가능<\/td><\/tr><tr><td>체육·예술 계열 선택 과목<\/td><td>3학점<\/td><td>2∼4학점<\/td><\/tr><\/tbody><\/table>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>특수 목적 고등학교가 아닌 경우에도 <ins class=\"upd\" data-old=\"&lt;표2&gt;의 선택 과목을 개설할 수 있으며, 이 경우 &lt;표1&gt;의 기본 학점과 증감 범위에 따라 선택 과목을 편성·운영해야 한다.\" data-why=\"2027 지침 〈표2〉 주석 ③\">〈표2〉의 과목을 개설할 수 있으며, 이 경우 ②의 기준이 아닌 〈표1〉의 교과(군)별 기본 학점과 증감 범위에 따라 편성·운영한다.<\/ins><\/li><\/ul><\/aside>"}, "com20": {"grp": "com", "num": "20", "sub": "1) 교육과정 편성", "title": "창의적 체험활동 영역별 이수 시수는 균등하게 편성해야 하나요?", "page": 57, "body": "<p>창의적 체험활동은 학교 여건에 따라 영역별 시수를 다르게 운영하는 것이 가능합니다. 모든 학년과 학기에 균등하게 배정해야 하는 것은 아니며 학년별, 학기별, 영역별로 다르게 편성·운영하는 것이 가능합니다. 다만, 특정 학년이나 학기에 편중하여 편성·운영하지 않도록 해야 합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학교는 창의적 체험활동의 영역을 학생의 발달 수준, 학교의 여건 등을 고려하여 자율적으로 편성·운영하고, 학생의 진로 및 적성과 연계하여 다양한 활동이 이루어질 수 있도록 한다.<\/li><\/ul><\/aside>"}, "com21": {"grp": "com", "num": "21", "sub": "1) 교육과정 편성", "title": "공동교육과정 운영 또는 참여 과목은 학교 교육과정에 어떻게 편성해야 하나요?", "page": 58, "body": "<p>공동교육과정 운영 과목은 소수 선택 및 교원 수급의 어려움으로 단위 학교에서 단독으로 개설하기 어려운 과목을 인근 학교와 연계·협력하여 개설하거나 해당 과목이 개설된 인근 학교에서의 이수를 인정하는 제도를 의미합니다. 거점학교 이외의 참여 학생 소속 학교에서는 공동교육과정 개설 강좌의 참여 요건을 단위 학교 교육과정에 편성되어 있지 않거나 편성되어 있더라도 공동교육과정 수강 신청 시작일을 기준으로 폐강이 확정된 경우로 제한하고 있으므로 참여 학생의 소속 학교 교육과정 편성에 편성되어 있어서는 안됩니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학교는 일정 규모 이상의 학생이 이 교육과정에 제시된 선택 과목의 개설을 요청할 경우 해당 과목을 개설해야 한다.<\/li><li>학교는 다양한 방식으로 학생의 선택 과목 이수 기회를 확대하기 위해 노력하되, 다음의 각호를 따른다.<ul class=\"dash\"><li>학교에서 개설하지 않은 선택 과목 이수를 희망하는 학생이 있을 경우 그 과목을 개설한 다른 학교에서의 이수를 인정한다.<\/li><\/ul><\/li><\/ul><\/aside>\n<aside class=\"cite\"><h6>2025 참학력 공동교육과정 운영 안내서(충남교육청, 2025.2) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>수강 신청<ul class=\"dash\"><li>단위 학교 미개설 과목(교육과정에 편제되지 않은 과목)에 한하여 공동교육과정 수강 신청 가능<\/li><li>단, 학교에서 개설 예정되어 있었으나 수강신청 시작일을 기준으로 폐강이 확정된 경우는 신청 가능<\/li><\/ul><\/li><\/ul><\/aside>"}, "com22": {"grp": "com", "num": "22", "sub": "2) 교육과정 운영", "title": "모든 과목을 한 학기 내에 이수해야 하나요?", "page": 58, "body": "<p>맞습니다. 2022 개정 교육과정에서는 학교가 학생이 모든 과목을 해당 학기로 이수하도록 편성·운영해야 함을 안내하고 있습니다. 단, 전문교과 중 전공 실무 과목은 연속한 두 개 학기에 걸쳐 이수가 가능합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>2022 개정 교육과정에서는 학교는 학생이 모든 과목을 학기 단위로 이수할 수 있도록 편성·운영해야 한다. 즉, 학생은 이수하는 과목을 한 학기 내에 이수해야 한다. 다만, 전문 교과 중 전공 실무 과목은 능력단위 기준으로 평가하는 상황을 고려하여 하나의 능력단위를 다음 학기에 이어서 평가하지 않는다는 전제하에 최대 2학기에 걸쳐 편성·운영할 수 있다.<\/li><\/ul><\/aside>"}, "com23": {"grp": "com", "num": "23", "sub": "2) 교육과정 운영", "title": "1학점 과목의 수업은 16회까지만 운영이 가능한가요?", "page": 58, "body": "<p>2022 개정 교육과정에서는 수업량 적정화에 따라 1학점의 수업량이 16회로 1회 감축되었으나 수업일수는 기존의 190일 이상이 유지되므로 과목에 따라 16회를 초과해 운영하는 것이 가능합니다. 하지만 수업량 적정화의 원래 취지에 맞게 16회 수업 이후의 시간을 활용하여 과목 이수 기준 미도달 학생을 대상으로 한 최소 성취수준 보장지도나 학교의 자율 교육 활동을 운영하는 것이 바람직합니다. 단, 이전과 같이 학교 자율 교육과정을 학교생활기록부 교과학습 발달상황의 개인별 세부능력 및 특기사항에 기재하는 것은 불가합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설 고등학교<\/h6><ul><li>2015 개정 교육과정에서는 1단위 수업량이 17회(16+1)였지만 2025년 입학생부터는 1학점 수업량이 16회이다. 이와 같이 1학점 수업량이 17회에서 16회로 변경되었지만, 수업일수는 기존의 190일 이상이 유지되기 때문에 학교에서는 학사 운영 방안을 적절하게 수립해야 한다. 학교는 16회 수업 실시 후의 시간을 활용하여 과목 미이수 학생을 대상으로 최소 성취수준 보장지도를 실시하거나 진로·진학 상담 등 학교에서 자율적인 프로그램을 운영할 수 있다.<\/li><\/ul><\/aside>"}, "com24": {"grp": "com", "num": "24", "sub": "2) 교육과정 운영", "title": "고교학점제 도입에 따라 졸업의 요건은 어떻게 바뀌나요?", "page": 59, "body": "<p>2024학년도 이전에는 과목별로 별도 이수 기준 없이 각 학년 수업 일수(190일 이상)의 2/3이상 출석 시 진급과 졸업이 가능했으나, 2025학년도 이후에는 과목별 이수 기준 충족을 통한 192학점 이상 취득 시 졸업이 가능합니다. 이에 따라, 종전의 학년별 출석 일수 미달에 따른 기존의 유급 처리 방식 이외에도 고등학교 3년간 졸업에 필요한 학점을 모두 취득하지 못한 경우 유급 처리하는 방식이 추가됩니다.<\/p>\n<aside class=\"cite\"><h6>2025학년도 학교생활기록부 기재요령(2025.2.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>유급은 출석일수 부족으로 해당 한년 교육과정을 미수료하여 상급학년으로 진급하지 못하거나, 출석일수 부족 또는 졸업에 필요한 학점을 모두 취득하지 못한 경우(2025학년도 1학년 이후)를 말한다.<\/li><\/ul><\/aside>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설 고등학교<\/h6><ul><li>2022 개정 교육과정에서는 2015 개정 교육과정과 달리 총 이수 학점 수를 제시하면서 ‘고등학교 졸업을 위해’라는 말이 추가되었다. 이것은 학점제 기반의 교육과정의 특성을 보여주는 것으로 학생이 192학점 이상을 이수해야 고등학교를 졸업할 수 있다는 것을 의미한다. 단위 학교에서는 학생이 최소 192학점을 이수할 수 있도록 교육과정을 편성·운영해야 한다. 단위 학교에서는 「초·중등교육법 시행령」 제92조의3에 의거하여 국가 교육과정의 범위에서 졸업의 기준을 학칙으로 정해야 한다.<\/li><\/ul><\/aside>"}, "com25": {"grp": "com", "num": "25", "sub": "2) 교육과정 운영", "title": "교과 최소 이수 학점이 174학점인데 이를 초과하여 이수하는 것이 가능한가요?", "page": 59, "body": "<p>2022 개정 교육과정에서 제시한 교과 총 이수 학점 174학점은 최소 이수 학점으로 학생의 희망에 따라 이를 초과하여 이수하는 것이 가능합니다. 이 경우, 국어, 수학, 영어 교과의 초과 이수 학점이 초과 이수 학점의 50%를 넘지 않아야 하며 특수 목적 고등학교는 특수 목적 고등학교의 선택 교과 과목에 한하여, 특성화고 및 산업수요 맞춤형 고등학교는 전문 교과의 과목에 한하여 초과 이수가 가능합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>국어, 수학, 영어 교과의 이수 학점 총합은 81학점을 초과하지 않도록 하며, 교과 이수 학점이 174학점을 초과하는 경우에는 초과 이수 학점의 50%를 넘지 않도록 한다.<\/li><li>학교는 학생의 필요와 학업 부담을 고려하여 교과(군) 총 이수 학점을 초과 이수하는 학점이 적정화되도록 하며, 특수 목적 고등학교는 특수 목적 고등학교 선택 과목에 한하여, 특성화 고등학교 및 산업수요 맞춤형 고등학교는 전문 교과의 과목에 한하여 초과 이수할 수 있다.<\/li><\/ul><\/aside>"}, "com26": {"grp": "com", "num": "26", "sub": "2) 교육과정 운영", "title": "교과 총 이수 학점이 174학점을 초과한 학생의 경우, 국어·수학·영어 교과를 최대 몇 학점까지 수강할 수 있나요?", "page": 60, "body": "<p>국어·수학·영어교과의 이수 학점 총합은 81학점을 초과하지 않아야 합니다. 이는 교과 총 이수 학점인 174학점의 50%인 87학점에서 ‘한국사1·2’ 이수 학점 6학점을 제외한 것입니다. 학생이 본인의 선택에 따라 174학점을 초과하여 교과를 이수했다면 국어·수학·영어 교과의 총 이수 학점이 초과 이수 학점의 50%를 넘지 않도록 해야 합니다. 예로 교과를 177학점 이수한 학생 있다면, 국어·수학·영어 교과의 총 이수 학점인 81학점에 초과 이수 학점인 3학점의 50%인 1.5학점을 합산한 82.5학점까지만 이수가 가능합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>국어, 수학, 영어 교과의 이수 학점 총합은 81학점을 초과하지 않도록 하며, 교과 이수 학점이 174학점을 초과하는 경우에는 초과 이수 학점의 50%를 넘지 않도록 한다.<\/li><\/ul><\/aside>"}, "com27": {"grp": "com", "num": "27", "sub": "2) 교육과정 운영", "title": "학교에서 고시 외 과목으로 사회·과학 교과군의 융합 선택 과목을 개설할 경우 성적 처리는 어떻게 해야 하나요?", "page": 60, "body": "<p>2022 개정 교육과정의 사회(역사/도덕포함)·과학 교과군의 융합 선택 과목의 경우, 과목별 성적 산출시 석차등급을 산출하지 않도록 안내하고 있습니다. 이에 해당하는 융합 선택 과목은 사회(역사/도덕 포함) 교과군의 ‘여행지리’, ‘역사로 탐구하는 현대 세계’, ‘사회문제 탐구’, ‘금융과 경제생활’, ‘윤리문제 탐구’, ‘기후변화와 지속가능한 세계’ 등 6개 과목과 과학 교과군의 ‘과학의 역사와 문화’, ‘기후변화와 환경생태’, ‘융합과학 탐구’ 등 3개 과목입니다. 이 과목 외에 학교에서 융합 선택 과목으로 개설·운영하는 사회·과학 교과군의 고시 외 과목은 이에 해당하지 않으며 5등급의 석차등급을 산출해야 합니다.<\/p>\n<aside class=\"cite\"><h6>2025학년도 학교생활기록부 기재 요령(2025.2.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>보통 교과의 사회(역사/도덕 포함)· 과학 교과(군)의 융합 선택 과목(‘여행지리, 역사로 탐구하는 현대 세계, 사회문제 탐구, 금융과 경제생활, 윤리문제 탐구, 기후변화와 지속가능한 세계, 과학의 역사와 문화, 기후변화와 환경생태, 융합과학 탐구’)과 특수교육 전문 교과는 석차등급을 산출하지 않고, 성취도를 5단계(A~E)로 산출함(세부적인 성적 산출 정보는 훈령 제15조 참조).<\/li><\/ul><\/aside>"}, "com28": {"grp": "com", "num": "28", "sub": "2) 교육과정 운영", "title": "2022 개정 교육과정의 창의적 체험활동은 자율·자치 활동, 동아리 활동, 진로 활동 세 영역으로 재구조화되었는데, 이제 봉사 활동은 어떻게 운영해야 하나요?", "page": 60, "body": "<p>봉사활동은 2022 개정 교육과정에서 동아리 활동의 하위 활동 영역으로 제시되어 있습니다. 다만, 봉사 활동의 성격상 창의적 체험활동 모든 영역의 활동과 연계·통합하여 운영하는 것이 가능합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>2022 개정 교육과정에서 창의적 체험활동은 학생의 자기 주도성과 선택을 확대하는 방향으로 개선되었다. 기존의 자율 활동, 동아리 활동, 봉사 활동, 진로 활동 영역이 자율·자치 활동, 동아리 활동, 진로 활동 세 영역으로 재구조화되었다. 기존의 봉사 활동은 동아리 영역의 하위 활동으로 편성되었으나, 그 성격상 창의적 체험활동 모든 영역의 활동과 연계·통합하여 운영할 수 있다.<\/li><\/ul><\/aside>\n<table class=\"t mini\"><thead><tr><th>영역<\/th><th>활동<\/th><th>예시 활동<\/th><\/tr><\/thead><tbody><tr><td rowspan=\"2\">자율·자치 활동<\/td><td>자율 활동<\/td><td class=\"l\">• 주제 탐구 활동 • 적응 및 개척 활동 • 프로젝트형 봉사활동<\/td><\/tr><tr><td>자치 활동<\/td><td class=\"l\">• 기본생활습관 형성 활동 • 관계 형성 및 소통 활동 • 공동체 자치활동<\/td><\/tr><tr><td rowspan=\"2\">동아리 활동<\/td><td>학술·문화 및 여가 활동<\/td><td class=\"l\">• 학술 동아리 • 예술 동아리 • 스포츠 동아리 • 놀이 동아리<\/td><\/tr><tr><td>봉사 활동<\/td><td class=\"l\">• 교내 봉사 활동 • 지역사회 봉사 활동 • 청소년 단체 활동<\/td><\/tr><\/tbody><\/table>"}, "com29": {"grp": "com", "num": "29", "sub": "2) 교육과정 운영", "title": "학교에서 선택 과목을 개설하는 기준이 꼭 있어야 하나요?", "page": 61, "body": "<p>2022 개정 교육과정에서는 교육과정에서 제시된 선택 과목의 개설 기준을 마련하도록 제시하고 있습니다. 학교는 지역의 여건이나 특성을 고려해 개설을 위한 ‘최소 학생 수’ 기준을 포함하여 선택 과목 조사 전에 학교 구성원들에게 안내해야 합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li class=\"gone\"><del class=\"upd\" data-old=\"공통 과목을 제외한 선택 과목은 한 학기에 이수가 가능하도록 과목별 적정 이수 학점을 편성하여 학생이 보다 다양한 과목을 선택할 수 있도록 노력해야 한다.\" data-why=\"2027 지침에 해당 조항 없음 — 인용에서 삭제\">2027 지침에 없는 조항 1건 삭제<\/del><\/li><li>학교는 일정 규모 이상의 학생이 이 교육과정에 제시된 선택 과목의 개설을 요청할 경우 해당 과목을 개설해야 한다.<\/li><\/ul><\/aside>\n<aside class=\"cite\"><h6>고교학점제 운영 안내서(교육부, 한국교육과정평가원, 2024.2) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>학교 규정 정비 (표 Ⅱ-1-1)<table class=\"t mini\"><thead><tr><th>관련 규정<\/th><th>규정 정비 주요 내용<\/th><\/tr><\/thead><tbody><tr><td>학교 규칙<\/td><td class=\"l\">• 총 이수 학점 및 졸업요건, 학기당 최소 수강 학점 수 등에 관한 사항<\/td><\/tr><tr><td>교육과정 편성·운영 규정<\/td><td class=\"l\">• 선택 교육과정 편성·운영에 관한 사항(수강 신청 절차, 과목 개설 및 폐강 기준, 선택 과목 변경 절차 및 기간, 공강 시간 운영 등)<\/td><\/tr><tr><td>학업성적관리규정<\/td><td class=\"l\">• 과목별 최소 성취수준 보장지도 운영 등에 관한 사항<\/td><\/tr><\/tbody><\/table><\/li><\/ul><\/aside>\n"}, "com30": {"grp": "com", "num": "30", "sub": "2) 교육과정 운영", "title": "단축수업을 운영한 경우 반드시 보강 수업을 운영해야 하나요?", "page": 61, "body": "<p>2022 개정 교육과정에서 1학점의 수업량은 50분씩 16회로 제시하고 있습니다. 학교에서 특정 상황에 따라 단축수업을 운영했다면 감축된 시간은 보충할 필요가 있습니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>1시간의 수업은 50분을 원칙으로 하되, 기후 및 계절, 학생의 발달 정도, 학습 내용의 성격, 학교 실정 등을 고려하여 탄력적으로 편성·운영할 수 있다. 단, 50분보다 적게 운영할 경우 감축된 시간은 보충하는 것이 원칙이다.<\/li><\/ul><\/aside>"}, "com31": {"grp": "com", "num": "31", "sub": "2) 교육과정 운영", "title": "교양 교과군의 과목이나 창의적 체험활동도 이수 기준이 있나요?", "page": 62, "body": "<p>2022 개정 교육과정은 교과와 창의적 체험활동 모두 이수 기준을 적용하도록 안내하고 있습니다. 다만, 교양 교과군의 과목이나 창의적 체험활동과 같이 별도의 학기말 성적을 산출하지 않는 과목의 경우에는 출석률을 기준으로 과목 이수 여부를 판단합니다. 단, 창의적 체험활동의 경우는 자율·자치 활동, 진로 활동, 동아리 활동 등 각 영역을 통합하여 전체 3개년의 실제 운영 수업 횟수의 2/3 이상 출석하면 학점 취득을 인정합니다.<\/p>\n<aside class=\"cite\"><h6>2025학년도 학교생활기록부 기재 요령(2025.2.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>교양과목과 학교 밖 교육과목은 출석률 기준만 적용<\/li><li>(창의적 체험활동 이수기준) 고등학교 전체(3개년)의 실제 운영 수업횟수의 2/3이상을 출석하면 학점 취득을 인정<\/li><\/ul><\/aside>"}, "com32": {"grp": "com", "num": "32", "sub": "2) 교육과정 운영", "title": "최소 성취수준 보장지도의 적용 범위는 어떻게 되나요?", "page": 62, "body": "<p>2025학년도 입학생부터 교과 및 창의적 체험활동의 이수 기준이 마련되며, 이중 성적을 산출하는 모든 과목은 미이수 예방을 위한 최소 성취수준 보장을 위한 예방과 보충지도가 실시되어야 합니다. 단, 교양 교과군의 과목의 출석률 미달 학생은 최소 성취수준 미달이 아니므로, 최소 성취수준 보장지도가 아닌 ‘추가학습’의 기회를 제공합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학교는 과목별 최소 성취수준을 보장하기 위해 학교의 여건 등을 고려하여 다양한 방식으로 예방·보충 지도를 실시한다.<\/li><\/ul><\/aside>\n<aside class=\"cite\"><h6>2025학년도 학교생활기록부 기재 요령(2025.2.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>(이수기준 미도달 시 조치) 과목과 창의적 체험활동 미도달 학생에게 추가적인 학점 취득 기회 제공<ul class=\"dash\"><li>(과목) 최소 성취수준 보장지도를 통해 학점 취득 기회 제공<\/li><li class=\"nm\">① (출석률 미도달) 최소 성취수준 보장지도에 준하는 추가학습을 통해 학점 취득 기회 제공(교양과목 포함)<\/li><li class=\"nm\">② (학업성취율 미도달) 최소 성취수준 보장지도를 통해 학점 취득 기회 제공<\/li><\/ul><\/li><\/ul><\/aside>"}, "com33": {"grp": "com", "num": "33", "sub": "2) 교육과정 운영", "title": "특수교육 대상 학생도 과목 이수 기준과 최소 성취수준 보장지도가 일반 학생과 동일하게 적용이 되나요?", "page": 62, "body": "<p>특수교육 대상 학생은 장애특성을 고려하여, 필요한 경우 별도의 이수 기준과 최소 성취수준 보장지도의 적용이 가능합니다. 이때 이수 기준인 출석률과 학업성취율을 별도 적용하거나 미적용하는 것이 가능하며 최소 성취수준 보장지도 대상자에서 제외하는 것도 가능합니다.<\/p>\n<aside class=\"cite\"><h6>특수교육대상학생 고교학점제 학점이수 인정기준 및 최소 성취수준 보장지도 운영 계획(교육부, 2024.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><div class=\"tw\"><table class=\"t mini\"><thead><tr><th rowspan=\"2\">구분<\/th><th colspan=\"2\">학점이수 인정기준<\/th><th colspan=\"2\">최소 성취수준 보장지도<\/th><th rowspan=\"2\">비고<\/th><\/tr><tr><th>출석률<br><small>(과목출석률 2/3 이상)<\/small><\/th><th>학업성취율<br><small>(학업성취율 40% 이상)<\/small><\/th><th>이수기준<br><small>(총 보충지도 운영 시수의 2/3 이상 참여)<\/small><\/th><th>운영 방법<br><small>(예방지도연계비율, 정서지원 제한 등)<\/small><\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"3\">특수<br>교육<br>대상<br>학생<\/td><td>적용<\/td><td>적용<\/td><td>적용<\/td><td>적용<\/td><td>이수기준 등 적용 가능 경우<\/td><\/tr>\n<tr><td rowspan=\"2\">별도 적용 가능<br>(해당 학년 수업일수의 2/3)<\/td><td rowspan=\"2\">별도 적용 가능<br>미적용 가능<\/td><td colspan=\"2\">별도 적용 가능<br>미적용 가능<br>- 최소 성취수준 보장지도 이수 기준, 운영 방법(예방지도 연계비율, 정서지원 프로그램 운영 비율, 대면지도 포함 여부 등)<\/td><td>이수기준 등 적용 곤란 경우<\/td><\/tr>\n<tr><td colspan=\"2\">최소 성취수준 보장지도 대상 제외<\/td><td>건강장애 원격수업 및 병원 학습 등 위탁교육 또는 순회 교육을 실시하는 경우<\/td><\/tr><\/tbody><\/table><\/div><\/aside>"}, "com34": {"grp": "com", "num": "34", "sub": "2) 교육과정 운영", "title": "공동교육과정도 최소 성취수준 보장지도를 운영해야 하나요?", "page": 63, "body": "<p>공동교육과정도 정규교육과정과 동일 과목 이수 기준이 적용되므로 2022 개정 교육과정이 적용되는 과목에 대해 미도달 예상학생에 대한 예방지도와 미도달 학생 대상 보충 이수 지도가 운영되어야 합니다.<\/p>\n<aside class=\"cite\"><h6>2025 참학력 공동교육과정 운영 안내서(충남교육청, 2025.2) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>이수기준<ul class=\"dash\"><li>과목 출석률(총 수업 시간의 2/3 이상 출석) 충족<\/li><li>학업 성취율(40% 이상) 충족<\/li><li>출석률 및 학업 성취율 미충족의 경우 최소 성취수준 보장지도 및 최소 성취수준 보장지도에 준하는 추가학습을 통해 학점 취득 기회 제공<\/li><\/ul><\/li><\/ul><\/aside>"}, "com35": {"grp": "com", "num": "35", "sub": "2) 교육과정 운영", "title": "전입생이 전출 학교에서 이수한 과목을 전입 학교의 교육과정 편제상 중복 이수해야 하는 경우에는 어떻게 해야 하나요?", "page": 63, "body": "<p>2022 개정 교육과정은 모든 과목을 학기별로 편성·운영하도록 안내하고 있습니다. 따라서 전입교에서 다른 과목을 선택할 수 있는 상황이라면 전입생이 전출교에서 이수한 과목을 전입교에서 중복 이수하는 것은 불가합니다. 단위 학교에서는 전입 학생의 과목 중복 이수 문제가 발생하지 않도록 학교 지정 과목을 최소화하거나 선택그룹 내 과목 수를 최대한 확보하는 방안이 필요합니다. 부득이하게 중복 이수 상황이 발생한 경우, 공동교육과정이나 소수 선택 과목을 통해 다른 과목을 선택해 이수하도록 해야 합니다.<\/p>"}, "com36": {"grp": "com", "num": "36", "sub": "2) 교육과정 운영", "title": "일반고에서 체육 특기생을 대상으로 필수 이수 학점을 일반 학생들과 다르게 적용할 수 있나요?", "page": 64, "body": "<p>단위학교에서 기초학력 보충교육이나 대안교육, 특수교육 등이 필요한 학생을 대상으로 별도의 교육과정을 2년 이상 운영하는 경우는 교육과정에서 안내하고 있는 필수 이수 학점을 일반학생들과 다르게 적용하는 것이 가능합니다. 다만 이때에도 국어, 수학, 영어 교과의 총 이수 학점이 81학점을 초과할 수 없으며 ‘한국사1·2’, ‘과학탐구실험1·2’, 체육 교과, 예술 교과군, 기술·가정/정보/제2외국어/한문/교양 교과(군)의 필수 이수 학점은 감축이 불가하며, 재학생 전체를 대상으로 필수 이수 학점을 조정하는 것도 불가합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>교과(군) 174학점 중 필수 이수 학점은 84학점으로 한다. 단, 필요한 경우 학교는 학생의 진로 및 발달 수준 등을 고려하여 필수 이수 학점 수를 학생별로 다르게 정할 수 있으며, 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다.<\/li><li class=\"gone\"><del class=\"upd\" data-old=\"기초학력 보충교육, 체육·예술·대안 교육이 필요한 학생 등 특별한 경우에 한하며 이러한 경우라도 체육·예술 및 생활·교양 교과 영역의 필수 이수 단위를 감하여 편성·운영할 수 없다.\" data-why=\"2015 개정 교육과정(2024 입학생) 조항 — 2027 지침에서 삭제\">2027 지침에 없는 조항 1건 삭제<\/del><\/li><li>학교는 직업교육 관련 학과를 설치·운영하거나 직업 위탁 과정을 운영할 수 있다. 이와 관련된 구체적인 사항은 국가직무능력표준(NCS) 기반 교육과정을 참조하여 학교교육과정위원회 검토와 학교운영위원회 심의를 거쳐 학교장이 정한다. 또한, 직업에 관한 과정을 2년 이상 운영하는 경우에는 특성화 고등학교와 산업수요 맞춤형 고등학교의 학점 배당 기준을 적용할 수 있다.<\/li><li><ins class=\"upd\" data-old=\"국어, 수학, 영어 교과 총 이수 학점이 81학점을 초과할 수 없으며, 교과 이수 학점이 174학점을 초과하는 경우에는 초과 이수 학점의 50%를 초과하지 않도록 한다.\" data-why=\"2027 지침 학점 배당 기준 ⑥ 문구\">국어, 수학, 영어 교과의 이수 학점 총합은 81학점을 초과하지 않도록 하며, 교과 이수 학점이 174학점을 초과하는 경우에는 초과 이수 학점의 50%를 넘지 않도록 한다.<\/ins><\/li><\/ul><\/aside>"}, "com37": {"grp": "com", "num": "37", "sub": "2) 교육과정 운영", "title": "학교 밖 교육이란 무엇인가요?", "page": 64, "body": "<p>학생이 수강을 희망하는 교과 또는 창의적 체험활동 중 학교장이 학교 내 개설 또는 공동교육과정으로 운영이 어렵다고 판단한 것에 대하여 일정한 요건을 갖춘 지역사회 기관을 통해 이수하는 교육과정입니다. 일반계고 학생 기준 3년간 최대 8학점 내에서 이수가 가능합니다.<\/p>\n<aside class=\"cite\"><h6>2025 일반고 학교 밖 교육 운영 지침(충남교육청, 2025.4.) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>운영 대상<ul class=\"dash\"><li>일반 고등학교(자율 고등학교 포함) 및 특수 목적 고등학교(산업수요 맞춤형 고등학교 제외) 재학생<\/li><\/ul><\/li><li>운영과목<ul class=\"dash\"><li>보통 교과의 선택 과목, 전문교과, 고시 외 과목 및 창의적 체험활동<\/li><li>학교 내 개설 또는 공동교육과정으로 운영이 어려운 경우에 한함<\/li><\/ul><\/li><li>이수 가능 학점<ul class=\"dash\"><li>3년간 최대 8학점 이내<\/li><\/ul><\/li><\/ul><\/aside>\n"}, "voc01": {"grp": "voc", "num": "01", "sub": "1) 교육과정 편성", "title": "2022 개정 교육과정에서 교과 구조와 과목군의 내용 체계는 2015 개정 교육과정과 비교했을 때 어떻게 달라졌나요?", "page": 65, "body": "<p>보통 교과의 경우 2015 개정 교육과정에 제시되었던 ‘교과 영역’ 구분이 사라졌으며, ‘공통 과목’은 유지되지만, ‘선택 과목’은 일반 선택, 진로 선택, 융합 선택 과목으로 재구조화되었습니다. 전문 교과는 기존 명칭이 일부 변경되어 전문 공통 과목, 전공 일반 과목, 전공 실무 과목으로 구분됩니다. 2015 개정 교육과정의 과목군 내용 체계는 내용 영역(능력단위), 내용 요소(능력단위 요소)로 구성되었으나, 2022 개정 교육과정의 과목군 내용 체계는 학습 영역(능력단위), 학습 요소(능력단위 요소)로 변경되었습니다.<\/p>"}, "voc02": {"grp": "voc", "num": "02", "sub": "1) 교육과정 편성", "title": "2022 개정 교육과정에서 직업계고의 과목별 이수 학점 증감 범위는 어떻게 변경되었나요?", "page": 65, "body": "<p>2022 개정 교육과정에서 직업계고의 과목별 이수 학점 증감 범위는 <ins class=\"upd\" data-old=\"47쪽과 같습니다.\" data-why=\"웹북 쪽 번호 대신 해당 절로 연결\">‘Ⅲ-4. 교과 및 과목 안내’의 <a href=\"#/s3-4\">과목별 이수 기본 학점과 증감 범위<\/a> 표와 같습니다.<\/ins><\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>전문 교과는 교육과정의 목표 및 내용을 고려하여 2학점 이상 편성·운영한다.<\/li><li>전공 실무 과목은 하나의 능력단위를 다음 학기에 이어서 평가하지 않는다는 전제하에 최대 2학기에 걸쳐 편성·운영할 수 있다.<\/li><\/ul><\/aside>"}, "voc03": {"grp": "voc", "num": "03", "sub": "1) 교육과정 편성", "title": "전공 실무 과목에서 1개의 동일한 능력단위를 교육과정 3개년 동안 중복 편성·운영 할 수 있나요?", "page": 65, "body": "<p>전문 교과 중 전공 실무 과목은 능력단위 기준으로 평가하는 상황을 고려하여 하나의 능력단위를 다음 학기에 이어서 평가할 수 없습니다. 따라서 예를 들어 A 능력단위는 교육과정 3개년 동안 한 학기에만 편성·운영할 수 있습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>2022 개정 교육과정에서는 학교는 학생이 모든 과목을 학기 단위로 이수할 수 있도록 편성·운영해야 한다. 즉, 학생은 이수하는 과목을 한 학기 내에 이수해야 한다. 다만, 전문 교과 중 전공 실무 과목은 능력단위 기준으로 평가하는 상황을 고려하여 하나의 능력단위를 다음 학기에 이어서 평가하지 않는다는 전제하에 최대 2학기에 걸쳐 편성·운영할 수 있다<\/li><\/ul><\/aside>"}, "voc04": {"grp": "voc", "num": "04", "sub": "1) 교육과정 편성", "title": "자율 이수 학점(30학점)은 어떻게 편성해야 하나요?", "page": 66, "body": "<p>자율 이수 학점은 학생의 적성, 진로, 산업계 수요, 학과별 인력 양성 유형 등을 고려하여 편성해야 합니다. 또한 학교는 학생들의 직업기초능력과 직무능력을 강화할 수 있도록 보통 교과와 전문 교과의 이수 학점을 적절히 배분하여 구성해야 합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>학교는 학생들의 직업기초능력과 직무능력을 제고할 수 있도록 보통 교과와 전문 교과의 이수 학점을 적정하게 배분하여 구성해야 한다. 또한 자율 이수 학점 30학점은 학생의 적성이나 진로, 산업계 수요, 그리고 학과별 인력 양성 유형 등을 고려하여 편성해야 한다<\/li><\/ul><\/aside>"}, "voc05": {"grp": "voc", "num": "05", "sub": "1) 교육과정 편성", "title": "전문 교과의 기초가 되는 과목을 보통 교과의 선택 과목으로 편성하여 운영할 경우 기술·가정/정보/제2외국어/한문/교양에 해당하는 8학점 전체를 대체 이수하는 것이 가능한가요?", "page": 66, "body": "<p>모두 대체 가능합니다. 다만, 학생의 전인적 발달, 학습의 위계성, 학습량 적정화, 교사 수급 등 학교의 여건을 충분히 고려하여 운영해야 합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>전문 교과의 기초가 되는 과목을 선택하여 이수할 경우, 이와 관련되는 보통 교과의 선택 과목 이수로 간주할 수 있다.<\/li><\/ul><\/aside>"}, "voc06": {"grp": "voc", "num": "06", "sub": "1) 교육과정 편성", "title": "전문 교과의 기초가 되는 과목을 보통 교과로 편성하여 이수할 경우 해당 전문 교과는 보통 교과의 선택 과목 이수로 인정되나요?", "page": 66, "body": "<p>인정됩니다. 특성화 고등학교와 산업수요 맞춤형 고등학교에서는 전문 공통 과목과 전공 일반 과목을 전문 교과의 기초 과목으로 간주합니다. 학교는 이를 보통 교과의 선택 과목으로 대체하여 편성할 수 있으며, 이 경우 보통 교과의 선택 과목 이수로 인정됩니다. 다만, 해당 과목의 학점 수 및 성적 산출 방식은 보통 교과 선택 과목 기준을 따라야 하며, 대체되는 과목은 유사한 성격을 가져야 합니다. 또한 보통 교과의 선택 과목에는 일반 선택, 진로 선택, 융합 선택 과목이 모두 포함됩니다. (구체적인 성적 처리 방식은 2025학년도 ‘학교생활기록부 기재요령’ 1학년 137쪽, 2·3학년은 172~173쪽 참고)<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>전문 교과의 기초가 되는 과목은 전문 공통 과목, 전공 일반 과목을 의미한다. 특성화 고등학교와 산업수요 맞춤형 고등학교에서 전문 교과의 기초가 되는 과목을 선택하여 이수할 경우 해당 전문 교과의 선택 과목 이수를 이와 관련되는 보통 교과의 선택 과목 이수로 간주할 수 있다.<\/li><\/ul><\/aside>"}, "voc07": {"grp": "voc", "num": "07", "sub": "1) 교육과정 편성", "title": "전문 교과와 보통 교과 중 학생 선택이 가능한 후학습 지원형 교육과정을 편성·운영할 경우 유의해야 할 사항은 무엇인가요?", "page": 67, "body": "<p>후학습 지원형 교육과정에서 보통 교과를 선택한 학생이 2025학년도 1학년부터 전문 교과 최소 이수 학점인 80학점 이상을 이수할 수 있고, 보통 교과의 최대 이수 학점인 94학점을 초과하지 않도록 편성해야 합니다. 또한 3학년 현장실습 학기에 보통 교과를 편성하려면, 별도의 이수 방법(대책)을 수립하고 교과협의회를 거쳐 학교 학업성적관리위원회(또는 현장실습관리위원회)에서 이를 심의하도록 하여 학교장의 승인을 받아야 합니다.<\/p>"}, "voc08": {"grp": "voc", "num": "08", "sub": "1) 교육과정 편성", "title": "‘공통수학1’와 ‘기본수학1’ 또는 ‘공통수학2’와 ‘기본수학2’를 모두 이수할 수 있나요?", "page": 67, "body": "<p>‘공통수학1, 2’를 이수한 이후, 선택 과목으로 ‘기본수학1, 2’를 편성하는 것은 불가능합니다. ‘기본수학1, 2’와 ‘기본영어1, 2’는 학생의 발달 수준 등을 고려하여 각각 ‘공통수학1, 2’와 ‘공통영어1, 2’를 대체 이수할 수 있는 공통 과목입니다. 따라서 공통 과목인 ‘기본수학1, 2’, ‘기본영어1, 2’는 선택 과목으로 편성할 수 없으며, ‘공통수학1, 2’와 ‘기본수학1, 2’를 모두 이수할 수는 없습니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학생의 발달 수준 등을 고려하여 공통수학1, 2와 공통영어1, 2를 기본수학1, 2와 기본영어1, 2로 대체하여 이수하도록 편성·운영할 수 있다. 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다.<\/li><\/ul><\/aside>"}, "voc09": {"grp": "voc", "num": "09", "sub": "1) 교육과정 편성", "title": "2022 개정 교육과정에서 ‘직무 의사소통’, ‘직무 수학’, ‘직무 영어’를 해당 교과(군)의 공통 과목 이수 전에 편성·운영할 수 있나요?", "page": 67, "body": "<p>2022 개정 교육과정에서는 ‘직무 의사소통’, ‘직무 수학’, ‘직무 영어’를 해당 교과(군)의 공통 과목을 이수하기 전에 편성·운영할 수 없습니다.  그러나 학생의 발달 수준 등을 고려하여 ‘공통수학1, 2’와 ‘공통영어1, 2’를 ‘기본수학1, 2’와 ‘기본영어1, 2’로 대체하여 이수하도록 편성·운영할 수 있습니다. 이와 관련된 구체적인 사항은 교육감이 정하는 지침에 따릅니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학생의 발달 수준 등을 고려하여 공통수학1, 2와 공통영어1, 2를 기본수학1, 2와 기본영어1, 2로 대체하여 이수하도록 편성·운영할 수 있다. 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다.<\/li><\/ul><\/aside>"}, "voc10": {"grp": "voc", "num": "10", "sub": "1) 교육과정 편성", "title": "2022 개정 교육과정에 개설된 고시 외 과목에는 어떤 과목이 있나요?", "page": 67, "body": "<p>고시 외 과목은 시·도교육감의 승인을 받아 운영되며, 시·도교육청 사이트 또는 에듀넷(www.edunet.net) &gt; 교육정책 &gt; 교육과정 &gt; 교육감 승인 과목 메뉴에서 확인할 수 있습니다.<\/p>"}, "voc11": {"grp": "voc", "num": "11", "sub": "1) 교육과정 편성", "title": "고시 외 전공 실무 과목을 개설하기 위해서는 어떠한 절차를 거쳐야 하나요?", "page": 68, "body": "<p>학교는 인력 양성 유형 등을 고려하여 교육에 필요한 학습 영역(능력단위)을 선정해야 합니다. 또한 이 학습 영역(능력단위)이 2022 개정 교육과정에 제시된 전공 실무 과목과 어떤 관계가 있는지 확인하여 새로운 전공 실무 과목 개설 여부를 판단할 필요가 있습니다. 새로운 전공 실무 과목을 개설할 경우 그 내용 체계는 반드시 국가직무능력표준(NCS)을 기반으로 구성되어야 합니다.<\/p>\n<p class=\"fn\">* 『전문 교과 전공 실무 과목의 학습 영역(능력단위) 구성 방법』 참고<br>** 미래인재과 - 16401(2024. 8. 13.)<\/p>"}, "voc12": {"grp": "voc", "num": "12", "sub": "1) 교육과정 편성", "title": "2개 이상 교과(군)의 전문 교과를 편성·운영할 수 있나요?", "page": 68, "body": "<p>가능합니다. 학교는 학과별로 특정 교과(군)에 국한하지 않고 인력 양성 유형 등에 따라 교육과정을 유연하게 구성할 수 있습니다. 이를 위해 17개 교과(군)에 속한 전공 일반 과목 또는 전공 실무 과목을 선택하여 교육과정을 편성·운영할 수 있습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>2022 개정 교육과정의 전문 교과는 국가직무능력표준(NCS) 분류 체계에 따라 17개 교과(군)로 재구조화되었으며 전문 공통 과목, 전공 일반 과목, 전공 실무 과목으로 구성되어 있다. 학교는 학과별로 특정 교과(군)에만 국한하여 과목을 선택하기보다는 인력 양성 유형 등에 따라 다른 교과(군)의 전공 일반 과목이나 전공 실무 과목을 선택하여 교육과정을 편성·운영할 수 있다.<\/li><\/ul><\/aside>"}, "voc13": {"grp": "voc", "num": "13", "sub": "1) 교육과정 편성", "title": "특성화 고등학교와 산업수요 맞춤형 고등학교에서 교과 총이수 학점의 초과 이수가 가능한 교과는 무엇인가요?", "page": 68, "body": "<p>특성화 고등학교와 산업수요 맞춤형 고등학교는 전공 분야의 진로 및 산업계 수요에 따른 전문 교육을 강화하기 위해 전문 교과의 과목에 한해 초과 이수할 수 있습니다. 단, 특성화 고등학교 학생이 일반 고등학교 학생과 함께 보통 교과(진로 선택 과목)로 편성된 전문 교과 과목을 공동교육과정으로 수강하는 경우 전문 교과 과목에 한해 초과 이수할 수 있다는 규정을 예외로 하여 보통 교과 초과 이수를 허용하고 있습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>특성화 고등학교와 산업수요 맞춤형 고등학교는 전공 분야의 진로 및 산업계 수요에 따른 전문 교육을 강화하기 위해 전문 교과의 과목에 한해 초과 이수하도록 한 것이다. 이는 설립 목적에서 벗어나 입시 과목 위주로 교육과정을 파행적으로 운영하는 것을 예방하려는 목적도 있다. 다만, 특성화 고등학교 학생이 일반 고등학교 학생과 함께 보통 교과(진로 선택 과목)로 편성된 전문 교과 과목을 공동교육과정으로 수강하는 경우 전문 교과 과목에 한해 초과 이수할 수 있다는 규정을 예외로 하여 보통 교과 초과 이수를 허용한다.<\/li><\/ul><\/aside>"}, "voc14": {"grp": "voc", "num": "14", "sub": "1) 교육과정 편성", "title": "세부전공(코스형), 부전공, 자격 취득 과정이 의미하는 바는 무엇인가요?", "page": 69, "body": "<p>세부전공 과정은 학과별 인력 양성 유형을 기반으로 자격·직무에 따라 세분화된 교육과정을 의미하며, 일반적으로 운영되던 전공 코스제를 의미합니다. 부전공 과정은 다기능 창의·융합형 기술 인재 양성을 목표로 학생이 소속 학과 외 타 학과의 과정을 일정 학점(24학점 이상) 이상 이수하면 부전공으로 인정받을 수 있는 과정입니다. 별도의 융복합 학과로의 개편 및 학생의 전공 학과 변경 없이 소속 학과의 전공 과정과 타 학과 과정 이수를 통해 학생의 과목 선택권 확대 및 산업 현장에서 요구하는 맞춤형 교육과정을 운영할 수도 있습니다. 자격 취득 과정은 학과의 인력 양성 유형과 연계된 자격(과정평가형 자격과 일학습병행 자격 등) 취득을 위한 과정으로, 자격에서 요구하는 과목 및 능력단위를 중심으로 교육과정을 편성·운영하는 것을 의미합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>부전공 과정은 다기능 창의·융합형 기술인재 양성을 위해 소속 학과 외 타 학과 전공 과정의 과목을 일정 기준 이상(24학점 이상) 선택·수강하여 부전공으로 인정받을 수 있는 학과 간 융합 교육과정을 의미한다. 별도의 융복합 학과로의 개편 없이도 소속 학과의 전공 과정과 타 학과 전공 과정의 과목을 이수하도록 하는 등 학생의 과목 선택권 확대 및 산업 현장에서 요구하는 맞춤형 교육과정을 운영할 수 있다.<\/li><\/ul><\/aside>"}, "voc15": {"grp": "voc", "num": "15", "sub": "1) 교육과정 편성", "title": "부전공 24학점을 이수할 때, 학과별로 동시에 중복 편성된 과목은 모두 이수해야 하나요? 또한 부전공으로 인정받을 수 있는 과목에는 전문 공통 과목, 전공 일반 과목, 전공 실무 과목이 모두 포함되나요?", "page": 69, "body": "<p>소속 학과와 타 학과에서 동시에 개설된 과목은 중복 이수할 필요 없이 한 번만 이수해도 부전공 이수 학점으로 인정됩니다. 그러나 부전공은 타 학과의 전공 역량을 갖추는 것이 목적이므로, 동시 개설 과목의 부전공 인정 학점 수를 적정하게 설정하고 타 학과의 능력단위를 체계적으로 이수하는 것이 중요합니다. 이에 따라 부전공 인정 과목의 범위는 전공 일반 과목과 전공 실무 과목으로 한정되며, 전문 공통 과목은 포함되지 않습니다. 학교는 ‘학교 교육과정 편성·운영 규정’ 등에 부전공 이수기준을 명확히 마련해야 합니다.<\/p>"}, "voc16": {"grp": "voc", "num": "16", "sub": "1) 교육과정 편성", "title": "학과는 다르지만 기준 학과가 동일한 경우에도 부전공으로 인정될 수 있을까요?", "page": 69, "body": "<p>기준 학과가 같더라고 부전공으로 인정될 수 있습니다. 부전공 이수형은 ‘소속 학과 외 다른 학과의 전공 과정을 최소 24학점 이상 이수한 경우’ 부전공으로 인정하는 내용을 포함하고 있기 때문입니다. 따라서 학교 내 타 학과의 전공과목을 심화 이수하는 경우라면 부전공으로 인정할 수 있습니다.<\/p>"}, "voc17": {"grp": "voc", "num": "17", "sub": "1) 교육과정 편성", "title": "4차 산업과 신산업·신기술 분야의 시대적 요구에 맞춰 교육과정에 없는 새로운 교과(군)를 설치하려면 어떤 절차를 거쳐야 하나요?", "page": 70, "body": "<p>새로운 교과(군)를 설치할 때는 유사한 교과(군)의 교육과정을 준용하는 것이 원칙이며, 유사한 교과(군)가 없을 경우 새로운 교육과정을 개발해야 합니다. 학교가 새로운 교과(군)를 설치하거나 운영하려면 충남 고등학교 교육과정 편성·운영 지침에 따라 교육감의 승인 절차를 거쳐야 합니다.<\/p>"}, "voc18": {"grp": "voc", "num": "18", "sub": "1) 교육과정 편성", "title": "학과에서 양성 가능한 인력 양성 유형을 선정하는 데 참고해야 할 자료가 있을까요?", "page": 70, "body": "<p>①\t직종별 직업사전은 고용노동부 워크넷 사이트(www.work.go.kr)에서 명칭별, 조건별 검색 외에 한국고용직업분류별, 한국표준직업분류별, 한국표준산업분류별 검색이 가능합니다.<\/p>\n<p>②\t국가직무능력표준 사이트(www.ncs.go.kr): 공정채용&gt;직업정보<\/p>\n<p>③\t국가직무능력표준 사이트(www.ncs.go.kr): 자료실 &gt;  통합자료실  &gt; 일반 자료실 &gt; NCS- 한국고용직업분류(KECO) 연계표(2022. 11. 28. NCS 개정 고시 기준)<\/p>\n<p>④\t에듀넷·티-클리어(www.edunet.net): 교육정책 ＞ 교육과정 ＞ 국가교육과정 ＞ 2022 개정 교육과정 ＞ 고등학교(교육부 고시 제2022-33호, 2022. 12. 22.)<\/p>\n<p>⑤\t국가교육과정 정보센터(http://ncic.go.kr): 교육과정 자료실 ＞ 2022 개정 시기 ＞ 고등학교(2022. 12.) ＞ 전문 교과 등이 있습니다.<\/p>"}, "voc19": {"grp": "voc", "num": "19", "sub": "1) 교육과정 편성", "title": "학과를 재구조화하여 새로운 학과를 신설하거나 교육과정을 변경하려면 어떻게 해야 하나요?", "page": 70, "body": "<p>환경·여건·실태 등의 조사·분석·정리 내용을 토대로 인력 양성 유형과 필요한 직무 내용을 조사·선정·결정하게 되며, 최종적으로 정규 교육과정에서 가르쳐야 할 교육 내용을 선정·조직하는 데 기준이 되는 교과(군)와 기준학과를 설정한 후 과목 간 연계성, 위계성 등을 고려하여 교과 교육과정을 체계적으로 편성·운영해야 합니다. 해당 내용은 고용노동부 워크넷 사이트 (www.work.go.kr), 직종별 직업사전, 에듀넷·티-클리어(www.edunet.net): 교육정책 ＞ 교육과정 ＞ 국가교육과정 ＞ 2022 개정 교육과정 ＞ 고등학교(교육부 고시 제2022-33호, 2022. 12. 22.) 등을 참고할 수 있습니다.<\/p>"}, "voc20": {"grp": "voc", "num": "20", "sub": "2) 교육과정 운영", "title": "세부전공 코스 선택 시 특정 전공으로 학생들의 선택이 집중될 경우 이를 완화할 방법에는 무엇이 있을까요?", "page": 70, "body": "<p>코스 및 과목 선택 시 특정 전공으로 학생들의 집중이 발생할 가능성을 고려하여 학생 선발 기준을 마련해야 합니다. 이를 방지하기 위해 충분한 진로 탐색 시간을 제공하고, 담임교사, 학과 전공 교사, 진로 전담 교사와의 상담을 통해 개인의 진로에 맞는 선택을 유도해야 합니다. 또한 특정 과목에 대한 수요가 편중될 경우 분반 여부 및 수업 개설·폐강 기준을 사전에 정하여 운영의 안정성을 확보해야 합니다.<\/p>"}, "voc21": {"grp": "voc", "num": "21", "sub": "2) 교육과정 운영", "title": "계열(학과)이 다른 학교 학생들이 공동실습소, 직업교육센터, 일반고, 특수목적고, 특성화고 등에서 개설한 교과(과정)를 함께 수강한 경우 수강자 수는 어떻게 산정하나요?", "page": 71, "body": "<p>수강자 수는 계열(학과)별로 구분하여 산출할 수 있습니다.<\/p>"}, "voc22": {"grp": "voc", "num": "22", "sub": "2) 교육과정 운영", "title": "현장실습을 교육과정에 포함하여 운영할 수 있나요?", "page": 71, "body": "<p>다양한 직업적 체험과 현장 적응력 제고 등을 위해 학교에서 배운 지식과 기술을 경험하고 적용하는 현장실습을 교육과정에 포함하여 운영할 수 있습니다. 현장실습은 향후 학생의 진로와 관련하여 직무수행에 필요한 지식·기술 및 태도를 습득할 수 있도록 실무 현장에서 실시하는 학교 교육과정의 일환이며, 현장 실습에는 교내 활동(산업 현장 전문가 학교 방문 교육 등)과 교외 활동 (산업체 체험형 현장실습, 연계교육형 현장실습, 산업체 채용형 현장실습)이 있습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>산업 분야의 인재 양성을 목적으로 하는 특성화 고등학교와 산업수요 맞춤형 고등학교는 학생이 이수한 교육과정과 관련된 직무 경험이 가능한 현장실습을 운영하여야 한다. 아울러 「직업교육훈련 촉진법」에 따라 직업 교육과정을 이수하는 학생의 경우 현장실습 참여 의무를 두고 있지만 학교에 재학 중인 학생의 경우 참여 선택권을 보장하고 있다.<\/li><\/ul><\/aside>"}, "voc23": {"grp": "voc", "num": "23", "sub": "2) 교육과정 운영", "title": "전공 실무 과목의 경우 학습 영역(능력단위)을 추가하거나 일부를 선택하여 운영할 수 있나요?", "page": 71, "body": "<p>국가직무능력표준(NCS)을 기반으로 학생 및 학교의 요구, 인력 양성 유형, 교육과정 운영 여건 등을 고려하여 학습 영역(능력단위)을 추가하거나 일부를 선택하여 운영할 수 있습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>2022 개정 교육과정에서는 2015 개정 교육과정과 동일하게 산업계의 수요 등을 고려하여 전문 교과의 교과 내용에 주제나 내용 요소를 추가하여 구성할 수 있도록 하였다. 그리고 전공 실무 과목의 경우에는 국가직무능력표준(NCS)에 기반을 두되 학생 및 학교의 요구, 인력 양성 유형, 교육과정 운영 여건 등을 고려하여 학습 영역(능력단위) 중 일부를 선택하여 운영할 수 있도록 하였다.<\/li><\/ul><\/aside>"}, "voc24": {"grp": "voc", "num": "24", "sub": "2) 교육과정 운영", "title": "전문 교과 전공 실무 과목은 국가직무능력표준(NCS)의 성취기준에 맞추어 학습 영역인 능력단위 기준으로 평가한다는 의미는 무엇인가요?", "page": 72, "body": "<p>전공 실무 과목은 전문 교과 성취평가제와 연계하여 학습자의 성취수준을 평가하되, 국가직무능력표준(NCS)의 능력단위를 기준으로 평가합니다. 이는 산업 현장의 요구를 고교 직업 교육에 반영함으로써 학생들이 학교 교육에서 경험한 학습 성과를 직무수행하는 데 활용되도록 하는 데 취지가 있습니다. 2022 개정 교육과정에서는 학습 영역인 1개의 능력단위를 두 학기에 걸쳐 평가할 수 없습니다. 1개의 능력단위는 반드시 1개 학기 안에 평가를 완료해야 한다는 점에 유의해야 합니다.<\/p>"}, "voc25": {"grp": "voc", "num": "25", "sub": "2) 교육과정 운영", "title": "전문 교과의 교과 내용을 추가하거나 일부 선택할 경우 유의해야 할 사항에는 무엇이 있습니까?", "page": 72, "body": "<p>전문 교과의 교과 내용을 추가하거나 일부 선택할 경우 유의해야 할 사항은 다음과 같습니다.<\/p>\n<ul class=\"sq\"><li>실무 과목에 특정 국가직무능력표준(NCS) 능력단위를 추가할 경우에는 실무 과목 명칭 및 기존의 학습 영역(능력단위)과 일관성이 있어야 합니다. 예를 들어 ‘헤어 미용’ 전공 실무 과목에 ‘헤어 미용’ NCS의 능력단위 가운데 전공 실무 과목에 반영되지 않은 ‘크리에이티브 헤어 커트’를 추가하여 운영할 수는 있지만, 인력 양성 유형과 무관한 ‘서양 조리’ NCS의 능력단위를 추가할 수는 없습니다.<\/li><li>전공 실무 과목의 학습 영역(능력단위) 중 일부를 선택하여 운영할 경우에는 지역 여건이나 산업 수요, 학교의 교육 환경 등에 기반을 두어야 하며, 선택한 학습 영역(능력단위)으로 해당 전공 실무 과목의 학습 목표를 구현할 수 있어야 합니다.<\/li><li>자격 취득 과정은 학과의 인력 양성 유형과 연계된 자격(과정평가형 자격과 일학습병행 자격 등) 취득을 위한 과정으로, 자격에서 요구하는 과목 및 능력단위를 중심으로 교육과정을 편성·운영하는 것을 의미합니다.<\/li><li>학교는 전공 실무 과목의 능력단위별 학습모듈이 새로 개발된 경우 새로운 학습모듈을 활용할 수 있습니다. 고용노동부가 고시하는 NCS는 수시로 개정되는 것에 반해, NCS 기반 교육과정의 수정 고시는 일정 시간과 절차가 필요하므로 교육과정이 새로 개발된 학습모듈을 반영하지 못하는 경우가 생길 수 있습니다. 따라서 학교는 추구하는 인력 양성 유형의 목표를 달성하기 위해 수정·고시된 NCS를 전문 교과의 교육과정에 활용할 수 있습니다.<\/li><\/ul>"}, "voc26": {"grp": "voc", "num": "26", "sub": "2) 교육과정 운영", "title": "전공 일반 과목에 NCS 능력단위를 연계하여 편성할 경우 성적 처리는 어떻게 하나요?", "page": 72, "body": "<p>전공 일반 과목의 성적은 수행평가에 능력단위 평가를 반영하여 성취도 5단계, 석차 등급 5단계로 처리합니다. 전문 교과 중 전공 일반 과목에 추가 편성한 능력단위를 평가할 때에는 이수 시간, 원점수, 성취도만 산출하며, 이는 학교생활기록부의 국가직무능력표준 이수 상황에 표기됩니다.<\/p>"}}</script>

 if(!a){setAcc(0);html=home()}
 else if(a==='changes'){setAcc(0);html=changesPage();title='2027 지침 반영 사항'}
 else if(a.startsWith('search')){setAcc(0);const q=new URLSearchParams(h.split('?')[1]||'').get('q')||'';html=searchPage(q);title='검색: '+q}
 else{const i=SECS.findIndex(s=>s.id===a);if(i<0){html='<div class="page"><h1 class="title">찾는 쪽이 없습니다</h1><p>주소가 바뀌었을 수 있습니다. 왼쪽 목차에서 원하는 절을 고르세요.</p></div>'}else{
  const s=SECS[i];setAcc(s.ch);title=s.title;
  const lk=toc.querySelector(`a[data-id="${s.id}"]`);if(lk)lk.setAttribute('aria-current','page');
  html=`<article class="page"><div class="crumb"><span>${CH[s.ch-1].n}. ${CH[s.ch-1].t}</span><span>원본 ${s.pages}쪽</span></div><h1 class="title">${s.title}</h1>${s.faq?faqHTML(s.faq):secHTML(s)}${pager(i)}</article>`;}}
 app.innerHTML=html;document.title=title+' | 충청남도교육청';
 app.querySelectorAll('table.t').forEach(t=>{if(!t.closest('.tw')&&!t.classList.contains('inner')){const w=document.createElement('div');w.className='tw';t.before(w);w.append(t)}});
 if(app.querySelector('.qa'))wireFaq();
 if(app.querySelector('.checklist'))wireChecklists();
 if(b){const d=document.getElementById('faq-'+b);if(d){d.open=true;requestAnimationFrame(()=>d.scrollIntoView({block:'start'}))}}
 else window.scrollTo(0,0);
 const si=$('#q');if(a&&a.startsWith('search'))si.value=new URLSearchParams(h.split('?')[1]||'').get('q')||'';
}
function home(){
 const n=collectChanges().filter(c=>c.type!=='확인 필요').length;
 return `<div class="page"><section class="hero"><p class="kicker">충청남도교육청 · 2027 지침 반영 웹북</p><h1>2022 개정 교육과정<span>편성·운영 도움자료</span></h1><p>학교 교육과정을 편성하고 운영할 때 필요한 기준과 절차, 자주 묻는 질문을 한곳에 모았습니다. 위쪽 검색창에 궁금한 낱말(예: 한국사, 공동교육과정, 이수 기준)을 넣으면 본문과 질문에서 바로 찾아 줍니다.</p></section>
 <div class="notice"><b>2027 지침 반영본</b> — 원본 책자(2025. 9.) 내용을 「2027 충남 참학력 고등학교 교육과정 편성·운영 지침」에 맞춰 ${n}곳 고쳤습니다. 고친 부분은 노란 바탕에 <b>2027</b> 표시가 붙어 있고, 누르면 고치기 전 문장을 볼 수 있습니다. <a href="#/changes">반영 사항 모아 보기</a></div>
 <div class="chgrid">${CH.map((c,i)=>{const f=SECS.find(s=>s.ch===i+1);return `<a class="chcard" style="--acc:var(${c.c})" href="#/${f.id}"><span class="n">${c.n}</span><span class="t">${c.t}</span><span class="d">${c.d}</span></a>`}).join('')}</div>
 <div class="quick"><a href="#/s4-1">자주 묻는 질문(공통)</a><a href="#/s4-2">자주 묻는 질문(직업계고)</a><a href="#/s5-2">자체 점검표(공통)</a><a href="#/s5-3">자체 점검표(특성화·산업수요 맞춤형)</a><a href="#/s2-2">연간 흐름표</a></div></div>`;
}
function changesPage(){
 const L=collectChanges();const g={'수정':[],'삭제':[],'확인 필요':[]};L.forEach(c=>g[c.type].push(c));
 const item=c=>`<div class="chg"><div class="w"><a href="${c.href}">${esc(c.where)}</a></div>${c.old?`<div class="o">${esc(c.old)}</div>`:''}${c.nw?`<div class="n">${esc(c.nw)}</div>`:''}<div class="y">${esc(c.why)}</div></div>`;
 return `<article class="page"><h1 class="title">2027 지침 반영 사항</h1><p>원본 책자와 달라진 부분입니다. 기준 문서는 「2027 충남 참학력 고등학교 교육과정 편성·운영 지침」(위원회 결과 반영본)이며, 확정·고시본에서 문구가 달라지면 다시 반영합니다.</p>
 <h3>수정 ${g['수정'].length}건</h3>${g['수정'].map(item).join('')}
 <h3>삭제 ${g['삭제'].length}건</h3>${g['삭제'].map(item).join('')}
 <h3>최신판 확인이 필요한 인용 자료 ${g['확인 필요'].length}건</h3><p class="fn">책자가 인용한 연도별 자료입니다. 최신판이 나오면 인용 문구를 확인합니다.</p>${g['확인 필요'].map(item).join('')}
 <h3>원본 오탈자 교정 ${FIX.length}건</h3>${FIX.map(f=>`<div class="chg"><div class="w">${esc(f[1])} (원본 ${f[0]}쪽)</div><div class="o">${esc(f[2])}</div><div class="n">${esc(f[3])}</div><div class="y">${esc(f[4])}</div></div>`).join('')}</article>`;
}
function searchPage(q){
 const r=search(q);
 return `<article class="page"><h1 class="title">‘${esc(q)}’ 검색 결과 ${r.length}건</h1>${r.length?'<ul class="results">'+r.slice(0,80).map(({it})=>`<li><a href="${it.href}">${esc(it.t)}</a>${it.where?`<div class="where">${it.where}</div>`:''}<p>${snippet(it.x,q)}</p></li>`).join('')+'</ul>':'<p>일치하는 내용이 없습니다. 띄어쓰기를 바꾸거나 더 짧은 낱말(예: ‘성취수준’)로 찾아보세요.</p>'}</article>`;
}
$('#sform').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(q)location.hash='#/search?q='+encodeURIComponent(q)});
// 변경 팝오버
let pop=null;
document.addEventListener('click',e=>{
 const u=e.target.closest('ins.upd,del.upd');
 if(pop){pop.remove();pop=null}
 if(!u||document.body.classList.contains('plain'))return;
 pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','dialog');
 pop.innerHTML=`<b>2027 지침 반영</b>${esc(u.dataset.why||'')}${u.dataset.old?`<div>고치기 전</div><div class="old">${esc(u.dataset.old)}</div>`:''}`;
 document.body.append(pop);const r=u.getBoundingClientRect();
 pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px';
 pop.style.top=(r.bottom+8+pop.offsetHeight>innerHeight?Math.max(8,r.top-pop.offsetHeight-8):r.bottom+8)+'px';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pop){pop.remove();pop=null}});
addEventListener('hashchange',render);
render();
})();
</script>
</body></html>
