<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2022 개정 교육과정 편성·운영 도움자료 | 충청남도교육청</title>
<meta name="description" content="충청남도교육청 2022 개정 교육과정 편성·운영 도움자료 웹북(2027 지침 반영)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
 --ink:#14233d;--ink2:#3b4a63;--mute:#6a768a;--line:#d9dfe8;--paper:#ffffff;--wash:#f4f6fa;--brand:#1d4f91;
 --c1:#3f7fc4;--c2:#2f9461;--c3:#16847f;--c4:#7d3f8c;--c5:#c2466f;--acc:var(--c1);
 --upd:#fff1c7;--updline:#c79100;--updink:#6b4d00;--rule:#eef3fb;--ruleline:#2f5f9e;
 --serif:"KoPubWorld바탕체 Medium","KoPubWorldBatang","Noto Serif KR","Nanum Myeongjo",serif;
 --sans:"KoPubWorld돋움체 Medium","KoPubWorldDotum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6ebf3;--ink2:#c3ccda;--mute:#93a0b4;--line:#2d3a4f;--paper:#111a28;--wash:#172234;--brand:#8fb6ea;--c1:#7fb0e6;--c2:#6cc596;--c3:#5cc3bd;--c4:#c592d3;--c5:#ee8fb0;--upd:#3b3016;--updline:#e0b43c;--updink:#f3d98c;--rule:#1a2a42;--ruleline:#6f9ad3}}
:root[data-theme="dark"]{--ink:#e6ebf3;--ink2:#c3ccda;--mute:#93a0b4;--line:#2d3a4f;--paper:#111a28;--wash:#172234;--brand:#8fb6ea;--c1:#7fb0e6;--c2:#6cc596;--c3:#5cc3bd;--c4:#c592d3;--c5:#ee8fb0;--upd:#3b3016;--updline:#e0b43c;--updink:#f3d98c;--rule:#1a2a42;--ruleline:#6f9ad3}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.8;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--updline);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);font-family:var(--sans)}
.top .brand{font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.top .brand small{display:block;font-weight:400;font-size:11px;color:var(--mute);line-height:1.2}
.top .srch{flex:1;max-width:520px;margin-left:auto;position:relative}
.top input[type=search]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:15px;background:var(--wash);color:var(--ink)}
.iconbtn{height:38px;min-width:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:0 10px}
.iconbtn[aria-pressed="true"]{background:var(--upd);border-color:var(--updline);color:var(--updink)}
#menuBtn{display:none}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);max-width:1320px;margin:0 auto}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:start;height:calc(100vh - 56px);overflow:auto;padding:20px 16px 40px 20px;border-right:1px solid var(--line);font-family:var(--sans);font-size:14px;line-height:1.45}
nav.toc .ch{margin:18px 0 6px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:baseline}
nav.toc .ch b{font-family:var(--serif);font-size:18px;min-width:22px}
nav.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink2);text-decoration:none}
nav.toc a:hover{background:var(--wash)}
nav.toc a[aria-current="page"]{background:var(--wash);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
nav.toc .util a{font-weight:600}
main{padding:28px 40px 80px;min-width:0}
.page{max-width:46rem;margin:0 auto}
.crumb{font-family:var(--sans);font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1.title{font-family:var(--sans);font-size:clamp(24px,3.2vw,32px);line-height:1.3;margin:0 0 24px;padding-bottom:16px;border-bottom:3px solid var(--acc);letter-spacing:-.01em}
h3,h4,h5,h6{font-family:var(--sans);line-height:1.4}
h3{font-size:21px;margin:40px 0 12px;color:var(--ink)}
h4{font-size:17px;margin:28px 0 8px}
h4.sub{display:flex;align-items:center;gap:8px}
h4.sub::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--acc);flex:none}
p{margin:0 0 14px}
p.lead{font-size:18px;color:var(--ink2)}
ul,ol{padding-left:1.3em;margin:0 0 14px}
ul.keys{list-style:none;padding:0}
ul.keys>li{margin:0 0 12px;padding-left:16px;position:relative}
ul.keys>li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
ul.keys b{font-family:var(--sans);color:var(--acc)}
ul.dash{list-style:none;padding-left:.2em;margin:6px 0}
ul.dash>li{padding-left:1em;text-indent:-1em}
ul.dash>li::before{content:"- "}
.note{background:var(--wash);border-radius:10px;padding:16px 20px;margin:16px 0 24px}
.note ul{list-style:none;padding:0;margin:0}.note li{padding-left:1em;text-indent:-1em;margin:4px 0}.note li::before{content:"- "}
.fn{font-size:14px;color:var(--mute);line-height:1.7;margin:10px 0 20px}
.tw,.tbl-wrap{overflow-x:auto;margin:12px 0 22px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14px;line-height:1.55;min-width:520px}
table.t th{background:var(--brand);color:#fff;font-weight:600;padding:8px 10px;border:1px solid var(--line);text-align:center;vertical-align:middle}
:root[data-theme="dark"] table.t th{color:#0d1726}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.t th{color:#0d1726}}
table.t td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle}
table.t td.l{text-align:left}
table.t tr.sum td{background:var(--wash);font-weight:700}
table.t .alt{color:var(--c5);font-weight:700}
table.t caption{caption-side:top;text-align:left;font-weight:700;padding:0 0 6px;color:var(--ink2)}
table.mini{min-width:420px;font-size:13px}
table.inner{min-width:0;margin-top:8px}
table.voc{min-width:900px}
ul.cl{list-style:none;padding:0;margin:0}ul.cl li{padding:1px 0}
ul.cl.two{columns:2;column-gap:16px}
ol.tnotes{list-style:none;padding:0;font-size:14px;color:var(--ink2);margin:-8px 0 26px}
.figure,figure{margin:18px 0 24px}
figure figcaption{font-family:var(--sans);font-weight:700;text-align:center;margin-bottom:10px}
ol.hub{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-family:var(--sans);font-size:14px;font-weight:600}
ol.hub li{border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:8px;padding:12px;text-align:center;background:var(--paper)}
figure.tree ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--line)}
figure.tree>ul{border:0;padding:0}
figure.tree li{margin:6px 0;position:relative;font-family:var(--sans);font-size:14px}
figure.tree li>span{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--wash);border:1px solid var(--line)}
figure.tree>ul>li>span{background:var(--acc);color:var(--paper);border-color:var(--acc);font-weight:700}
figure.timeline ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;font-family:var(--sans);font-size:13px;counter-reset:t}
figure.timeline li{position:relative;padding:28px 8px 0;text-align:center;border-top:3px solid var(--acc)}
figure.timeline li::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--acc)}
figure.timeline b{display:block}figure.timeline span{display:block;color:var(--ink2)}figure.timeline em{display:block;font-style:normal;color:var(--mute)}
/* 규정 박스: 책자의 조문 박스 */
.rule{position:relative;margin:22px 0 10px;padding:14px 18px 14px 56px;background:var(--rule);border-left:4px solid var(--ruleline);border-radius:0 10px 10px 0;font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.7}
.rule .rn{position:absolute;left:16px;top:12px;font-size:22px;line-height:1.2;color:var(--ruleline);font-weight:700}
.rule ul.dash{font-weight:500}
p.exp{position:relative;padding-left:26px;color:var(--ink2);font-size:16px}
p.exp::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;border:2px solid var(--mute);border-radius:50%}
p.exp::after{content:"";position:absolute;left:14px;top:1.25em;width:6px;height:2px;background:var(--mute);transform:rotate(45deg)}
p.ref{font-family:var(--sans);font-size:14px;background:var(--wash);border-radius:8px;padding:10px 14px}
p.ref.warn{border-left:4px solid var(--c5)}
/* 단계 */
ol.steps-map{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:s;font-family:var(--sans);font-size:14px;font-weight:600}
ol.steps-map li{counter-increment:s;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
ol.steps-map li::before{content:counter(s) "단계";display:block;color:var(--acc);font-size:12px}
.step{margin:40px 0;padding-top:8px;border-top:1px solid var(--line)}
.step-h{display:flex;align-items:baseline;gap:12px}
.step-no{font-family:var(--sans);font-weight:800;font-size:15px;color:var(--paper);background:var(--acc);border-radius:6px;padding:2px 10px;white-space:nowrap}
.step-h h3{margin:12px 0}
.step-main{display:flex;gap:12px;align-items:flex-start;font-family:var(--sans);font-size:15px}
.step-main .tag{flex:none;background:var(--upd);color:var(--updink);font-weight:700;font-size:13px;padding:2px 8px;border-radius:4px;margin-top:3px}
.step-main ul{margin:0;padding-left:1.1em}
h5.bar{font-size:15px;margin:22px 0 8px;color:var(--acc)}
.focus{border:2px dashed var(--line);border-radius:12px;padding:14px 18px;margin:18px 0}
.focus h5{margin:0 0 6px;font-size:15px;color:var(--c4)}
.focus ul{list-style:none;padding:0;margin:0;font-family:var(--sans);font-size:15px;font-weight:600}
.focus li{padding-left:26px;position:relative;margin:6px 0}
.focus li::before{content:"✓";position:absolute;left:4px;color:var(--c5);font-weight:800}
.mini-flow{margin-top:10px;font-size:13px}.mini-flow .mf-t{margin:0 0 4px}
.mini-flow ol{margin:0;padding-left:1.3em}.mini-flow li b{display:block}.mini-flow li span{display:block;color:var(--ink2)}
/* 2027 변경 표시 */
ins.upd{text-decoration:none;background:var(--upd);box-shadow:inset 0 -2px 0 var(--updline);color:inherit;cursor:pointer;border-radius:2px}
ins.upd::after{content:"2027";font-family:var(--sans);font-size:10px;font-weight:700;color:var(--updink);vertical-align:super;margin-left:2px}
body.plain ins.upd{background:none;box-shadow:none}body.plain ins.upd::after{content:none}
li.gone{list-style:none;margin-left:-1.1em}
del.upd{text-decoration:none;font-family:var(--sans);font-size:12px;color:var(--updink);background:var(--upd);padding:1px 6px;border-radius:4px;cursor:pointer}
body.plain li.gone{display:none}
.chk{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--c5);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
body.plain .chk{display:none}
.pop{position:fixed;z-index:50;max-width:min(420px,92vw);background:var(--paper);color:var(--ink);border:1px solid var(--updline);border-radius:10px;padding:12px 14px;font-family:var(--sans);font-size:13px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.pop b{display:block;color:var(--updink);margin-bottom:4px}.pop .old{background:var(--wash);border-radius:6px;padding:6px 8px;margin:6px 0;text-decoration:line-through;text-decoration-color:var(--mute)}
/* FAQ */
.faq-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;font-family:var(--sans)}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.faq-sub{font-family:var(--sans);font-size:15px;color:var(--mute);margin:28px 0 8px}
details.qa{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--paper)}
details.qa[open]{border-color:var(--acc)}
details.qa>summary{list-style:none;cursor:pointer;display:flex;gap:12px;padding:14px 16px;font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.5}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary .qn{flex:none;color:var(--acc);font-size:15px;min-width:36px}
details.qa>summary .qt{flex:1}
details.qa>summary .has{flex:none;align-self:center;font-size:10px;font-weight:700;color:var(--updink);background:var(--upd);border-radius:4px;padding:1px 5px}
.qa-body{padding:0 18px 14px 64px}
.qa-body>p{position:relative}
.qa-body>p:first-child::before{content:"A";position:absolute;left:-44px;top:0;font-family:var(--sans);font-weight:800;color:var(--mute)}
.qa-tools{display:flex;gap:10px;font-family:var(--sans);font-size:12px;margin-top:6px}
.qa-tools button{border:0;background:none;color:var(--brand);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
aside.cite{background:var(--wash);border-radius:10px;padding:12px 16px;margin:12px 0;font-family:var(--sans);font-size:14px;line-height:1.7}
aside.cite h6{margin:0 0 6px;font-size:13px;color:var(--c4);border-bottom:1px solid var(--line);padding-bottom:6px}
aside.cite ul{margin:0;padding-left:1.1em}
figure.scan img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
ul.sq{list-style:"▣ ";padding-left:1.4em}
/* 부록 */
ul.sites{list-style:none;padding:0}ul.sites li{border-bottom:1px solid var(--line);padding:14px 0}
ul.sites h4{margin:0 0 4px}ul.sites p{margin:0 0 4px;font-size:15px;color:var(--ink2)}ul.sites a{font-family:var(--sans);font-size:14px;word-break:break-all}
.checklist{counter-reset:ck}
.ckbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px;margin-bottom:10px}
.ckbar .prog{margin-right:auto;color:var(--ink2)}
h4.ckh{counter-reset:ck;margin-top:26px;color:var(--acc)}
.ck{counter-increment:ck;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start;border-bottom:1px solid var(--line);padding:12px 0;font-family:var(--sans);font-size:15px}
.ck>p{margin:0;font-weight:600}.ck>p::before{content:counter(ck) ". ";color:var(--acc)}
.ck.memo>p::before{content:""}
.ck>:not(p):not(.ox){grid-column:1}
.ck .ox{grid-column:2;grid-row:1;display:flex;gap:4px}
.ox button{width:40px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink2);font:inherit;font-size:16px;cursor:pointer}
.ox button[aria-pressed="true"][data-v="o"]{background:var(--c2);border-color:var(--c2);color:#fff}
.ox button[aria-pressed="true"][data-v="x"]{background:var(--c5);border-color:var(--c5);color:#fff}
.ck textarea{grid-column:1/-1;width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--wash);color:var(--ink)}
/* 홈 */
.hero{padding:26px 0 8px}
.hero .kicker{font-family:var(--sans);color:var(--mute);font-size:14px;margin:0}
.hero h1{font-family:var(--sans);font-size:clamp(30px,5vw,48px);line-height:1.2;margin:6px 0 14px;letter-spacing:-.02em}
.hero h1 span{display:block;font-size:.55em;font-weight:500;color:var(--ink2)}
.hero p{max-width:40rem;color:var(--ink2)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:26px 0}
.chcard{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-top:6px solid var(--acc)}
.chcard:hover{background:var(--wash)}
.chcard .n{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--acc);line-height:1}
.chcard .t{font-family:var(--sans);font-weight:700;font-size:17px;margin:8px 0 4px;display:block}
.chcard .d{font-family:var(--sans);font-size:13px;color:var(--mute)}
.quick{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--sans)}
.quick a{border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.notice{border:1px solid var(--updline);background:var(--upd);color:var(--updink);border-radius:12px;padding:14px 16px;font-family:var(--sans);font-size:14px;margin:20px 0}
.notice b{color:inherit}
/* 검색·변경 */
.results{list-style:none;padding:0}.results li{border-bottom:1px solid var(--line);padding:12px 0}
.results a{font-family:var(--sans);font-weight:700;text-decoration:none}.results .where{font-family:var(--sans);font-size:12px;color:var(--mute)}
.results p{margin:4px 0 0;font-size:15px;color:var(--ink2)}mark{background:var(--upd);color:inherit}
.chg{border-left:4px solid var(--updline);padding:10px 14px;margin:12px 0;background:var(--wash);border-radius:0 10px 10px 0;font-family:var(--sans);font-size:14px}
.chg .w{font-weight:700}.chg .o{text-decoration:line-through;color:var(--mute)}.chg .n{color:var(--ink)}.chg .y{color:var(--updink);font-size:13px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--sans);font-size:14px}
.pager a{text-decoration:none;max-width:48%}.pager small{display:block;color:var(--mute)}
footer{font-family:var(--sans);font-size:12px;color:var(--mute);text-align:center;padding:30px 16px 40px;border-top:1px solid var(--line)}
@media (max-width:900px){
 #menuBtn{display:inline-block}
 .shell{grid-template-columns:1fr}
 nav.toc{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:0;width:min(86vw,320px);height:auto;z-index:30;background:var(--paper);transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
 body.nav-open nav.toc{transform:none}
 main{padding:20px 16px 60px}
 .top .brand small{display:none}
 body{font-size:16px}
 ol.steps-map{grid-template-columns:repeat(2,1fr)}
 .qa-body{padding:0 14px 12px 14px}.qa-body>p:first-child::before{content:none}
 figure.timeline ol{grid-template-columns:repeat(2,1fr);row-gap:22px}
 ul.cl.two{columns:1}
}
@media (max-width:520px){.top .brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,nav.toc,.pager,.ckbar,.qa-tools,.faq-tools,footer{display:none!important}.shell{display:block}main{padding:0}details.qa{break-inside:avoid}ins.upd{background:none;box-shadow:none}body{font-size:11pt}}
li.nm{list-style:none;margin-left:-1.1em}ul.dash>li.nm::before{content:none}
@media (max-width:600px){.top{gap:6px;padding:0 10px}.iconbtn{font-size:13px;padding:0 8px}}
</style></head>
<body>

<template id="tpl-s1-1" data-sec data-ch="1" data-title="1. 2022 개정 교육과정" data-pages="3-6">
<h3>가. 2022 개정 교육과정 특징</h3>
<p>2022 개정 고등학교 교육과정은 학점 기반 선택 중심 교육과정으로 필수 이수 학점이 축소되고 선택 과목 체계가 변화하였으며 과목별 이수 기준이 도입되었습니다.</p>
<figure class="fig-hub">
  <figcaption>학점 기반 선택 중심 교육과정 운영</figcaption>
  <ol class="hub">
    <li>학기제 과목 운영</li><li>필수 이수 학점 축소</li><li>이수 기준 도입</li><li>선택과목 체계 변화</li><li>자율 이수 학점 확대</li>
  </ol>
</figure>
<ul class="keys">
<li><b>학기 단위 과목 이수:</b> 고교학점제 도입에 따라 학생이 학기 단위로 과목을 이수할 수 있도록 편성·운영</li>
<li><b>선택 과목 체계 변화:</b> 선택 과목을 ‘일반 선택 과목’, ‘진로 선택 과목’, ‘융합 선택 과목’으로 구분하여 학생의 과목 선택권을 확대하고 학생의 적성과 진로, 흥미와 관심에 따른 맞춤형 교육을 지원</li>
<li><b>필수·자율 이수 학점의 변화:</b> 일반고의 경우 필수 이수 학점을 국어, 수학, 영어, 사회, 과학 교과(군)에서 각 2학점씩 10학점 줄이고 (58 → 48) 자율 이수 학점을 80학점에서 90학점으로 확대</li>
<li><b>이수 기준 도입:</b> 학업성취율 40% 이상 + 과목 출석률 2/3 이상으로 이수기준 설정</li>
</ul>

<p class="lead">고교학점제는 학생이 기초 소양과 기본 학력을 바탕으로 진로·적성에 따라 과목을 선택하고, 이수 기준에 도달한 과목에 대해 학점을 취득·누적하여 졸업하는 제도입니다. 이 제도는 학생의 수요를 반영한 교육과정 구성, 학생들이 진로와 연계된 학업 계획을 수립하고 책임 있게 이수할 수 있도록 진로·학업 설계 지도 체계화, 학생들이 과목 이수 기준에 도달하여 학점을 취득할 수 있도록 최소 성취수준 미도달 예방과 보충지도 등 학교 책임 교육 강화에 중점을 두고 있습니다. 고교학점제 시행에 따라 다음과 같은 학교의 변화가 나타날 것입니다.</p>

<template id="tpl-s1-3" data-sec data-ch="1" data-title="3. 과목 선택 지도의 중요성" data-pages="8-13">
<h3>가. 2022 개정 교육과정의 이해와 과목 선택 환경 변화</h3>
<h4>1) 미래 역량 함양 및 학생 맞춤형 교육 강화의 방향</h4>
<p>2022 개정 교육과정은 급변하는 미래 사회에 필요한 역량을 함양하고 학생 개개인의 성장을 지원하는 데 초점을 맞춥니다. 지속가능한 사회를 위한 생태전환교육 및 민주시민교육이 전 교과에 반영되며, 미래세대의 핵심역량으로 디지털 기초 소양 강화 및 정보 교육이 확대됩니다.</p>
<p>학생 맞춤형 교육 강화는 고교학점제를 통해 구체화됩니다. 학생들의 탐구 역량 강화를 위한 교과 재구조화와 과목 선택권 확대는 학습자의 성장을 지원하는 핵심 기제로 작용합니다. 학생들이 자신의 흥미와 적성을 바탕으로 과목을 선택함으로써 학습 동기를 유발하고, 무기력에서 벗어나 적극적으로 학습에 참여할 수 있도록 독려하는 것이 중요합니다. 또한, 학교급 전환 시기의 진로 연계 및 학교생활 적응을 위한 진로연계교육이 도입되었으므로, 이 시기에 학생들의 진로 탐색을 적극적으로 지원해야 합니다.</p>
<h4>2) 교과 재구조화 및 과목 선택권 확대의 의미</h4>
<p>학생들은 자신의 진로와 적성에 따라 일반 선택, 진로 선택, 융합 선택 과목을 직접 선택하여 이수하게 됩니다. 이는 단순히 정해진 교육과정을 수동적으로 따르는 것이 아니라, 학생 스스로 학습 목표, 시기, 학습량을 결정하고 배움의 질을 보장하며, 궁극적으로 자기 주도적 학습 습관과 진로 개척 역량을 기르는 데 중점을 둡니다. 학생들이 이러한 자기 주도성을 발휘할 수 있도록 충분한 정보를 제공하고, 개별 상담을 통한 선택 지원이 중요합니다.</p>
<h4>3) 교과(국어, 영어, 사회, 과학, 정보 등)의 변화와 지도 방향</h4>
<p>2022 개정 교육과정은 주요 교과목에도 상당한 변화를 가져왔습니다. 각 교과의 변화를 숙지하고, 학생들의 과목 선택 및 학습에 반영하는 것이 중요합니다. 각 교과의 특성을 살려 학생들이 의미 있는 학습 경험을 쌓을 수 있도록 수업을 설계하고, 학교생활기록부 세부능력 및 특기사항 기록에 충실히 반영하는 것이 중요합니다.</p>

<h3>나. 대입전형과 과목 선택</h3>
<p>2028학년도 대입은 내신 5등급제 전환과 통합형 수능 도입을 핵심으로 합니다. 이러한 변화는 학교 교육과정 편성 및 운영에 직접적인 영향을 미치며, 이에 대한 학교의 선제적 대응이 중요합니다. 내신 평가에서는 5등급 상대평가와 성취평가가 적용되면서 대학은 학교생활기록부의 정성적 요소, 특히 세부능력 및 특기사항 등을 통해 학생의 학업 역량과 진로 적합성을 심층적으로 평가할 것으로 예상됩니다. 따라서 학교는 학생들이 수업 참여와 탐구 활동을 통해 의미 있는 학습 경험을 쌓고, 이를 학교생활기록부에 충실히 기록할 수 있는 교육과정을 운영해야 합니다. 교과 수업 내에서 발표, 토론, 과제 수행 등 다양한 활동을 통해 학생의 역량이 발현될 수 있는 기회를 제공하는 것이 중요합니다.</p>
<p>다음으로 수능은 국어, 수학, 사회, 과학 영역에서 선택 과목이 폐지되고 ‘통합사회’와 ‘통합과학’ 등 공통과목 중심으로 출제됩니다. 이는 계열 구분 없이 수능을 실시하여 과목 선택에 의한 유불리 문제를 해소하려는 취지입니다. 그러나 대학들은 입학 후 전공 학습의 원활한 진행을 위해 특정 심화 과목 이수 여부를 중요하게 평가할 수 있습니다. 따라서 학교는 교육과정의 내실 있는 운영과 더불어, 학생들의 진로 심화 학습을 위한 다양한 선택 과목을 개설하고, 학교 내 개설이 어려운 과목은 공동교육과정이나 온라인학교 등을 통해 이수할 수 있도록 지원해야 합니다. 이는 학생들이 수능 준비와 동시에 자신의 진로를 심화하는 학습을 병행할 수 있도록 돕는 중요한 역할을 합니다.</p>
<p>마지막으로 학교생활기록부 반영이 모든 대입전형에서 확대될 전망입니다. 학생부교과, 학생부종합, 논술 전형 등 전형 유형에 따라 학교생활기록부의 출결, 교과 성적, 교과 이수 현황, 교과(종합)평가 등이 반영될 수 있습니다. 이는 학교 교육과정 내에서의 과목 이수 현황, 학업 역량, 진로 적합성 등이 종합적으로 평가됨을 의미하므로, 학교는 교육과정 편성 시 대입전형과의 연계성을 면밀히 고려해야 합니다. 학교생활의 충실성이 대입에 직접적인 영향을 미치게 되므로, 3학년 2학기 수업 운영의 파행을 방지하고 학생들이 고등학교 3년 동안 일관성 있는 학습을 이어갈 수 있도록 교육과정을 설계하는 것이 중요합니다.</p>

<h4>2) 2028 대학입시제도 개편안</h4>
<ul class="keys"><li><b>수능 체제 변화: 통합형 수능 도입과 선택 과목 폐지</b></li></ul>
<p>2028학년도 대학수학능력시험부터 국어, 수학, 사회, 과학 영역의 선택 과목이 모두 폐지되며, 모든 수험생이 동일한 공통과목을 응시하게 됩니다. 국어 영역은 선택 과목이 폐지되지만 문항 수와 시험시간은 현행과 같이 45문항 80분으로 유지됩니다. 수학 영역 역시 선택 과목이 폐지되고 문항 수와 시험시간은 현행처럼 30문항(단답형 9문항 포함) 100분으로 유지됩니다.</p>
<p>특히 사회탐구 영역과 과학탐구 영역은 선택 과목이 폐지되고 ‘통합사회’와 ‘통합과학’이 출제되며, 각각 25문항 40분으로 운영됩니다. 기존 수학 선택 과목인 미적분, 기하가 수능 출제 범위에서 제외되는 것도 중요한 변화입니다.</p>
<p>이러한 수능 변화에 따라 학생들이 공통과목의 기본 개념을 탄탄히 하고 문제 해결 능력을 키울 수 있도록 지원이 필요합니다. 또한, 수능 출제 범위에서 제외된 심화 과목의 경우, 학생들의 진로와 연계하여 교육과정에 편성하여 이수할 수 있도록 하고 학교생활기록부 기록을 통해 심화 학습 역량을 보여줄 수 있도록 지원해야 합니다.</p>

<p>2022 개정 교육과정에서는 대부분의 과목이 5등급 상대평가가 적용되어 학생들은 과목 선택에 더 신중을 기할 수밖에 없습니다. 학생들이 단순히 좋은 등급을 받는 것을 넘어, 자신의 진로와 역량에 맞는 과목을 선택하고 이수할 수 있도록 지도해야 합니다. 학생들이 과목 선택의 진정성, 수업 참여도, 탐구 활동 등을 통해 자신의 학업 역량과 진로 적합성을 나타낼 수 있도록 수업 및 평가 운영할 때 적극 반영할 필요가 있습니다.</p>

<h4>3) 과목 선택 지도의 주안점</h4>
<p>2028학년도 대입에서는 학생의 ‘전공 연계 교과목 이수 여부’가 대학 입시 평가의 핵심 변수로 작용할 전망입니다. 이는 단순히 성적 관리를 넘어 진로와 포부에 대한 심층적 이해와 학습 성취를 중요하게 평가하겠다는 대학의 의지를 반영합니다. 주요 대학들이 자연계열 전공별 교과 이수 권장과목을 구체적으로 제시하기 시작하면서, 학교는 이러한 정보를 교육과정 편성 및 학생 상담에 적극적으로 활용해야 합니다.</p>
<p>학교는 학생들이 자신의 학업 수준과 진로 목표를 면밀히 분석하고 전략적으로 과목을 선택할 수 있도록 지원해야 합니다. 단순히 점수가 잘 나올 수 있는 과목을 선택하는 것을 넘어, 진로와 연계된 의미 있는 학습 경험을 제공할 수 있는 과목을 선택하도록 유도하는 것이 중요합니다. 예를 들어, 인공지능 관련 전공을 희망하는 학생이 정보 교과 외에도 영어 과목에서 인공지능 관련 해외 기사를 탐구하거나, 사회 과목에서 인공지능 윤리를 다루는 등 교과 간 융합을 통해 자신의 관심 분야를 심화할 수 있도록 교육과정을 유연하게 운영하고 지원해야 합니다. 이러한 활동은 학생부 세부능력 및 특기사항에도 긍정적으로 작용하여 학생의 학업 역량과 진로 적합성을 효과적으로 드러낼 수 있습니다.</p>
<p>궁극적으로 학교 교육과정의 편성 및 운영은 학생들이 변화하는 대입 환경을 성공적으로 헤쳐나가고, 자신의 잠재력을 최대한 발휘하여 미래 사회의 주역으로 성장하는 데 필수적인 기반을 제공합니다. 이는 단순한 입시 준비를 넘어, 학생 개개인의 삶을 설계하는 중요한 과정이 됩니다. 학교는 학생 중심의 교육과정을 통해 학생들이 자기 주도적으로 진로를 개척하고, 깊이 있는 학습을 통해 미래 사회에 필요한 역량을 함양할 수 있도록 지속적으로 노력해야 합니다.</p>

<p class="lead">학교에서는 지역 및 학교의 실정을 반영하여 다음 6단계 절차에 따라 학교 교육과정을 편성·운영합니다.<sup class="fnref">1)</sup></p>

<div class="step" id="step1"><div class="step-h"><span class="step-no">1단계</span><h3>교육과정 편성·운영 계획 수립</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>학교교육과정위원회 조직 구성</li><li>조직, 임무, 역할의 구체화</li><li>추진 일정 및 업무 분담 계획</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>교육과정 편성은 학교 교육의 방향을 결정하는 출발점입니다. 학교교육과정위원회는 학교장이 교육과정 운영에 관한 의사를 결정하는 데 자문 역할을 하는 조직으로 국가 수준 교육과정에 명시되어 있습니다. 이 위원회는 단순한 형식적 조직이 아니라 학교 교육과정의 질적 향상을 위한 전문적 협의체로서 기능해야 합니다. 위원회 구성 시에는 구체적으로 업무 분과를 구성하고 업무를 분담하며, 학교 교육 계획 수립을 위한 기본계획을 작성하면서 추진 조직, 추진 절차, 일정, 업무 분담, 소요 예산 등을 종합적으로 검토해야 합니다. 체계적인 계획 없이는 구성원들의 역할이 모호해지고, 일정 지연으로 인한 부실한 편성이 이루어질 수 있습니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>분과별 업무를 명확히 하여 책임감 있는 참여 유도</li><li>학부모, 지역인사, 전문가 등이 참여하여 다각적 관점에서 학교 교육과정을 검토</li><li>특성화고·산업수요맞춤형고는 학교교육과정위원회에 산업계 인사가 반드시 참여</li></ul></div>
</div>

<div class="step" id="step2"><div class="step-h"><span class="step-no">2단계</span><h3>상위 교육과정과 편성·운영 지침 분석</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>교육부 고시 초·중등학교 교육과정 분석</li><li>충남교육청 교육과정 편성·운영 지침 검토</li><li>학교 교육의 목표와 노력 중점 분석</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>학교 교육과정은 국가 교육과정과 시도 교육과정의 틀 안에서 편성되어야 합니다. 국가 교육과정은 꼭 지켜야 할 기본 틀을, 충남 지침은 지역 특성을 반영한 구체적 운영 방안을 제시합니다. 상위 지침을 정확히 이해하지 않으면 법적 요구사항을 놓치거나, 학교 특색을 살릴 수 있는 자율성의 범위를 파악하지 못할 수 있습니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>‘반드시 지켜야 할 것’과 ‘학교가 자율적으로 결정할 수 있는 것’ 명확히 구분하고 필요시 학교 규정 정비</li><li>국가 교육과정 변경 사항 및 시행 시기 확인</li><li>충남 지역 특성 및 정책 방향과의 연계성 검토</li><li>국가·도 교육과정 교육 목표와 일관성을 유지하면서도 학교 실정이 반영된 구체적이고 실현 가능한 목표와 노력 중점 방향 수립</li></ul></div>
<h5 class="bar">학교 규정 정비 사항</h5>
<p>고교학점제에 기반한 2022 개정 교육과정의 적용으로 학교에서는 변화된 총 이수 학점, 졸업 요건, 최소 성취수준 보장지도 운영 등을 반영하여 학교 규정을 개정해야 하며 <ins class="upd" data-id="U03" data-old="2026학년도는 1, 2학년으로 대상 학년이 확대 적용되므로" data-why="2027 지침 부칙: 2027. 3. 1.자로 고등학교 모든 학년에 시행">2027학년도부터는 고등학교 모든 학년에 적용되므로</ins> 관련 내용의 규정을 꼼꼼히 살펴볼 필요가 있습니다.</p>

<div class="step" id="step3"><div class="step-h"><span class="step-no">3단계</span><h3>기초 조사</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>학생, 교원, 보호자의 요구 조사</li><li>학교의 여건, 교원 현황 파악</li><li>교사의 전문성, 교원연수 계획, 학습 자료 구비 실태 확인</li><li>이용 가능한 지역사회의 인적·물적 자원 조사</li><li>학교 교육과 유관한 교육 활동의 결과 분석</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>기초조사는 학교 실정에 맞는 교육과정 편성을 위한 핵심 단계입니다. 충남 지침에 따르면 ‘교직원의 조직, 학생의 실태, 보호자의 요구, 지역사회의 특수성 및 교육 시설과 설비 등 교육 여건과 환경을 반영하여 학교 교육과정을 편성·운영’하도록 명시되어 있습니다.</p>
<p>단순한 설문조사가 아니라 교육과정 편성의 기초 자료를 체계적으로 수집하는 과정으로, 학생의 진로 희망과 학습 능력, 교사의 전문성과 연수 요구, 학부모의 기대와 지역사회의 교육 자원 등을 종합적으로 파악해야 합니다. 특히 전년도 교육과정 운영 실적을 기초로 하여 개선점을 도출하고, 학교의 규모와 실정, 교육 여건, 교과의 특성 등을 구체적으로 분석하여 실현 가능하면서도 의미 있는 교육과정을 설계하기 위한 정보를 수집하는 과정입니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>조사 결과의 객관성과 신뢰성 확보 방안 마련</li><li>전년도 교육과정 운영 결과와 교육공동체의 의견 수렴 반드시 포함</li><li>공동교육과정, 학교 밖 교육과정, 충남 온라인학교 연계 가능성도 함께 조사</li><li>소규모 학교는 인근 학교와의 협력 방안 사전 탐색</li></ul></div>
<h5 class="bar">학생 선택권 확대를 위한 조사</h5>
<p>단위 학교의 여건(교원 수급, 소인수 선택 등)으로 개설하기 어려운 과목에 대한 학생 수요를 파악하고, 다음과 같은 외부 자원 연계 가능성을 함께 조사해야 합니다.</p>
<ul class="keys">
<li><b>참학력 공동교육과정 :</b> 학생 과목 선택권 보장 및 맞춤형 진로·학업 설계 지원을 위해 학교, 지역사회, 대학의 인적·물적 인프라를 연결하여 단위 학교를 넘어서는 개방적이고 유연한 학생 선택 중심 교육과정으로 유형은 다음과 같습니다.
<ul class="dash">
<li>학교 연합 공동교육과정 : 단위 학교가 주관하여 인근 학교와 연합으로 과목을 개설하고 운영하는 형태입니다. 거점학교가 운영 계획을 자체적으로 수립하여 자율적이고 탄력적으로 운영할 수 있는 특징이 있습니다.</li>
<li>지역 연계 공동교육과정 : 교육지원청이 주관하여 지역 내 고등학교와 연합으로 과목을 개설하고 운영합니다. 교육지원청에서 지역별 협의회를 통해 개설 과목과 거점학교를 지정하여 체계적으로 운영하는 방식입니다.</li>
<li>온라인 공동교육과정 : 시공간 제약 없는 온라인 교실 환경을 구축하여 운영합니다. 오프라인 형태의 공동교육과정 운영이 어려운 교과들의 수요를 파악하여 쌍방향 온라인 수업 형태로 제공합니다.</li>
<li>대학 연계 공동교육과정 : 도교육청과 대학이 업무협약을 통해 지원체제를 구축하여 운영하는 공동교육과정입니다. 업무협약을 체결한 대학에서 개설한 진로 맞춤형 교육프로그램을 학생들에게 제공하는 방식으로 운영됩니다.</li>
<li>마을 연계 공동교육과정 : 마을 자원을 기반으로 단위 학교에서 개설이 어려운 심화된 교육프로그램을 제공합니다. 이를 통해 학생들에게 풍부한 교과 융합형 진로 탐구 활동 경험을 제공할 수 있습니다.</li>
</ul></li>
<li><b>온라인학교 :</b> 정규 일과시간 내 운영을 원칙으로 실시간 쌍방향 원격수업 방식으로 운영되는 교육과정으로, 소인수 과목이나 교사 수급이 어려운 과목을 개설하는 데 유용합니다.</li>
<li><b>학교 밖 교육 :</b> 학생의 수요에 따라 지역 사회 기관과 연계하여 이루어지는 교육으로 과목 또는 창의적 체험활동으로 이수하는 방식입니다.</li>
</ul>
<h5 class="bar">소규모 학교 교육과정 편성 시 고려사항</h5>
<ul class="keys">
<li><b>교육과정 이해도 제고 및 협력체계 구축</b><ul class="dash"><li>학교교육과정위원회, 교육과정 이수 지도팀, 전문적학습공동체 등을 통한 학교 현황 인식 제고</li><li>학생·보호자 대상 진로·진학 지도 및 상담, 교육과정 연수, 선택 과목 설명회 등 실시</li><li>체계적인 진로·학업 설계 지원을 통한 명확한 선택 과목 수요 조사</li></ul></li>
<li><b>소규모 학교 특성 반영 교육과정 설계</b><ul class="dash"><li>학기별 총 이수 학점 통일 및 교과(군)별 평균 시수 고려한 선택 과목 편성</li><li>교과(군)별 교사 수 및 이동 수업 교실 수를 종합 검토한 과목 개설 계획</li><li>다과목 지도로 인한 교사 부담 경감을 위한 체계적 접근</li></ul></li>
<li><b>교사 수급 및 외부 자원 활용</b><ul class="dash"><li>강사 및 순회 교사 활용을 통한 교사 수급 부족 해결</li><li>학교 간 공동교육과정 적극 활용</li><li>온라인학교 등 다양한 외부 자원을 통한 교육과정 다양화</li></ul></li>
<li><b>안정적 교육과정 운영 기반 마련</b><ul class="dash"><li>수요 조사 결과를 바탕으로 한 예측 가능한 과목 개설 및 교사 배치</li><li>이동 수업 시간표 작성 등 운영의 안정성 확보</li></ul></li>
</ul>
</div>

<div class="step" id="step4"><div class="step-h"><span class="step-no">4단계</span><h3>학교 교육과정 편성·운영 시안 작성</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>활동 내용 선정 및 시간 배당</li><li>교육 활동 시간과 교육 내용의 개요 확정</li><li>교육 내용의 연간 프로그램 작성 (지도 영역과 내용 요소 체계화)</li><li>지도교사 배정 및 집단 편성</li><li>시간 운영 계획 및 교과교실 등 포함</li><li>교육자료 확보 및 지도 방법의 구체화</li><li>평가 계획 수립</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>앞선 단계에서 수집한 정보를 바탕으로 구체적이고 실행 가능한 교육과정을 설계하는 핵심 단계입니다. 충남 지침에 따르면 “교과와 창의적 체험활동의 편성·운영은 학교의 규모와 실정, 교육 여건, 교과의 특성 등을 고려하여 작성하되, 지도 시간의 확보와 운영 방법이 구체적으로 나타나도록” 해야 합니다.</p>
<p>학교 교육과정 편성·운영 시안 작성은 교육과정의 기준과 목표를 조사한 자료를 바탕으로 학교 상황에 맞게 재구성하는 단계입니다. 단순히 과목을 나열하는 것이 아니라, 학생들의 요구와 진로를 고려한 개별 맞춤형 교육이 가능하도록 교육과정을 체계적으로 설계해야 합니다.</p>
<p>특히 활동 내용 선정과 시간 배당에서는 국가 교육과정의 기준 시수를 준수하면서도 학교 특성을 반영할 수 있는 융통성을 발휘해야 하며, 지도 영역과 내용 요소의 체계화를 통해 학년별·교과별 연계성을 확보해야 합니다. 또한 지도교사 배정과 집단 편성은 교사의 전문성과 학생의 학습 효과를 동시에 고려하여 최적의 교육 환경을 조성하는 것이 중요합니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>진로·학업설계 관련 학생의 진로 희망과 연계된 과목 선택권 보장</li><li>시수 배당 적정성 확보를 위해 국가 교육과정 기준 시수 준수 및 학교 재량 시간 합리적 활용</li><li>교육과정 연계성 강화를 위한 학년별·교과별 내용의 계열성과 통합성 확보</li><li>교사 배치와 교실 운영의 현실적 제약 조건 반드시 고려</li><li>교육자료 확보의 현실성 검토하여 예산 범위 내에서 실현 가능한 계획 수립</li><li>공강 시간 운영 계획 포함 실제 시간표 편성 가능성 사전 검토하여 현실적 교육과정 구성</li></ul></div>
<h5 class="bar">공강 시간 운영</h5>
<ul class="keys"><li>학생의 과목 선택 상황에 따라 발생하는 공강 시간을 효과적으로 활용할 수 있도록 관련 운영 방안 마련(운영 프로그램, 지도(관리)교사 등)</li></ul>
<h4 class="sub">공강 시간 운영 프로그램 예시</h4>
<table class="t">

<div class="step" id="step5"><div class="step-h"><span class="step-no">5단계</span><h3>심의 및 확정</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>학교교육과정위원회의 검토 및 수정</li><li>학교운영위원회 심의</li><li>학교장 결재</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>작성된 학교 교육과정 편성·운영 시안이 실제로 운영 가능한지, 법적 요구사항을 모두 충족하는지 최종 점검하는 단계입니다. 다양한 관점에서의 검토를 통해 교육과정의 완성도를 높이고, 민주적 절차를 통해 교육공동체의 합의를 이끌어냅니다. 학교교육과정위원회는 전문적 관점에서, 학교운영위원회는 구성원 대표 기구로서 민주적 심의를, 학교장 결재는 최종 책임자로서의 교육과정 운영 의지를 표명합니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>학교교육과정위원회의 검토 및 수정을 통한 교육과정 편성의 적정성 확인</li><li>학교운영위원회 심의 과정을 거쳐 교육공동체의 민주적 의사결정 보장</li><li>학교장 결재를 통한 최종 교육과정 운영 책임과 의지 표명</li><li>심의 과정에서 제기된 의견의 합리적 검토 및 필요시 교육과정 수정·보완</li></ul></div>
</div>

<div class="step" id="step6"><div class="step-h"><span class="step-no">6단계</span><h3>운영과 평가</h3></div>
<div class="step-main"><span class="tag">주요내용</span><ul><li>학교 교육과정 운영</li><li>학교 교육과정 운영 평가</li><li>학교 교육과정 평가 결과 분석과 환류</li></ul></div>
<h5 class="bar">이해 하기</h5>
<p>확정된 교육과정이 계획대로 실행되고 있는지, 당초 의도한 교육 목표를 달성하고 있는지 지속적으로 점검하고 개선하는 단계입니다. 아무리 완벽한 교육과정을 편성해도 실제 운영 과정에서는 예상하지 못한 문제점이 발생하거나, 학생과 교사의 요구가 변화할 수 있습니다. 운영은 계획된 교육과정이 실제 교실에서 구현되는 과정으로, 단순히 시간표대로 수업하는 것이 아니라 학생의 성장을 위한 의미 있는 학습 경험이 제공되는지 지속적으로 모니터링해야 합니다. 평가는 교육과정의 적절성, 효과성, 효율성을 다각도로 검토하며, 환류는 평가 결과를 다음 연도 교육과정 편성에 반영하여 지속적인 개선이 이루어지도록 하는 것이 핵심입니다.</p>
<div class="focus"><h5>중점 고려사항</h5><ul><li>운영 과정에서 나타나는 문제점의 신속한 파악 및 개선</li><li>학생의 성장, 교사의 만족도, 학부모의 인식, 지역사회의 평가 등 종합적 고려</li><li>평가 결과의 객관성 및 신뢰성 확보</li><li>차년도 교육과정 편성을 위한 체계적 환류 체계 구축</li></ul></div>
</div>

<div class="rule"><span class="rn">①</span>1학점은 50분을 기준으로 하여 16회를 이수하는 수업량이다.</div>
<p class="exp">1학점 수업량이 17회에서 16회로 변경되었지만 수업일수는 기존의 190일 이상이 유지되기 때문에 학교에서는 학사 운영 방안을 적절하게 수립해야 한다.</p>
<div class="rule"><span class="rn">②</span>1시간의 수업은 50분을 원칙으로 하되, 기후 및 계절, 학생의 발달 정도, 학습 내용의 성격, 학교 실정을 고려하여 탄력적으로 편성·운영할 수 있다.</div>
<p class="exp">50분보다 적게 운영할 경우 감축된 시간은 보충하는 것이 원칙이다.</p>
<div class="rule"><span class="rn">③</span>공통 과목의 기본 학점은 4학점이며, 1학점 범위 내에서 감하여 편성·운영할 수 있다. 단, 한국사1, 2의 기본 학점은 3학점이며 감하여 편성·운영할 수 없다.</div>
<p class="exp">학생이 학기 단위로 과목을 이수하도록 교육과정을 편성·운영해야 한다. 이를 위하여 공통 과목을 ‘공통 과목1, 공통 과목2’로 구성하여 학기 단위 과목 편성·운영이 가능하도록 하였다. 공통 과목은 기본 학점에서 1학점 감하여 편성·운영 가능하나 증배하여 편성·운영할 수 없다. ‘한국사1, 한국사2’의 경우 공통 과목이므로 증배하여 편성할 수 없고, 동시에 감하여 편성·운영할 수 없는 기준에 의해 3학점으로만 편성·운영해야 한다.</p>
<div class="rule"><span class="rn">④</span>과학탐구실험1, 2의 기본 학점은 1학점이며 증감 없이 편성·운영하는 것을 원칙으로 한다. 단, 과학, 체육, 예술 계열 고등학교의 경우 학교 실정에 따라 탄력적으로 운영할 수 있다.</div>
<div class="rule"><span class="rn">⑤</span>필수 이수 학점 수는 해당 교과(군)의 최소 이수 학점이다. 특수 목적 고등학교와 자율 고등학교의 경우 예술 교과(군)는 5학점 이상, 기술·가정/정보/제2외국어/한문/교양 교과(군)는 12학점 이상 이수하도록 한다.</div>
<p class="exp">일반 고등학교와 달리 특수 목적 고등학교의 예술 교과(군)와 기술·가정/정보/제2외국어/한문/교양 교과(군)의 필수 이수 학점 기준이 각각 5학점과 12학점으로 설정된 이유는 학교 설립 취지에 맞는 교육과정 편성·운영의 유연성을 확보하기 위한 것이다.</p>
<div class="rule"><span class="rn">⑥</span>국어, 수학, 영어 교과의 이수 학점 총합은 81학점을 초과하지 않도록 하며, 교과 이수 학점이 174학점을 초과하는 경우에는 초과 이수 학점의 50%를 넘지 않도록 한다.</div>
<div class="rule"><span class="rn">⑦</span>창의적 체험활동의 학점 수는 최소 이수 학점이며 (&nbsp;&nbsp;)안의 숫자는 이수 학점을 시간 수로 환산한 것이다.</div>
<p class="exp">창의적 체험활동의 이수 학점은 18학점이며, 고등학교 3년간 이수해야 할 최소 이수 학점이므로 학교에서는 이를 충족해야 한다. 괄호 안의 숫자는 이수 학점 18학점을 학점당 16시간으로 환산하여 3년간 이수해야 할 최소 이수 시간 수이다. 학점 수에 얽매이지 않고 시간 수를 고려하여 학교가 자율적으로 편성·운영할 수 있도록 하기 위한 것이다.</p>
<div class="rule"><span class="rn">⑧</span>총 이수 학점 수는 고등학교 졸업을 위해 3년간 이수해야 할 최소 이수 학점을 의미한다.</div>
<p class="exp">학교에서는 학생이 최소 192학점을 이수할 수 있도록 교육과정을 편성·운영해야 한다. 학교에서는 「초·중등교육법 시행령」 제92조의3에 의거하여 국가 교육과정의 범위에서 졸업의 기준을 학칙으로 정해야 한다.</p>
<p class="exp">2022 개정 교육과정에서는 ‘고등학교 졸업을 위해’라는 말이 추가되었다. 이것은 고교학점제 기반의 고등학교 교육과정 특성을 보여 주는 것으로 192학점 이상을 이수해야 고등학교를 졸업할 수 있다는 것을 의미한다.</p>
<div class="rule"><span class="rn">⑨</span>과목의 이수 시기와 학점은 학교에서 자율적으로 편성·운영한다.
<ul class="dash"><li>공통 과목은 해당 교과(군)의 선택 과목 이수 전에 편성·운영하는 것을 원칙으로 한다.</li><li>학생의 발달 수준 등을 고려하여 공통수학1, 2와 공통영어1, 2를 기본수학1, 2와 기본영어1, 2로 대체하여 이수하도록 편성·운영할 수 있다.</li><li>선택 과목 중에서 위계성을 갖는 과목의 경우, 계열적 학습이 가능하도록 편성한다. 단, 학교의 실정 및 학생의 요구, 과목의 성격에 따라 탄력적으로 편성·운영할 수 있다.</li></ul></div>
<p class="exp">‘기본수학1’은 ‘공통수학1’을, ‘기본수학2’는 ‘공통수학2’를 각각 대체하므로 ‘기본수학1’과 ‘공통수학1’을 모두 이수할 수 없고, ‘기본수학2’와 ‘공통수학2’를 모두 이수할 수는 없다.</p>
<p class="exp">직무 의사소통, 직무 수학, 직무 영어를 해당 교과(군)의 공통 과목 이수 전에 편성·운영할 수 없다.</p>
<p class="exp">위계성이 명확한 과목은 대체로 Ⅰ과 Ⅱ로 표기하고 있다. 다만, 선택 과목을 편성하는 경우 학생이 과목을 이수하는 데에 무리가 없도록 보통 교과의 관련 선택 과목을 먼저 이수하도록 학교 교육과정을 편성하는 것이 바람직하다.</p>
<div class="rule"><span class="rn">⑩</span>학교는 학생의 필요와 학업 부담을 고려하여 교과(군) 총 이수 학점을 초과 이수하는 학점이 적정화되도록 하며, 특수 목적 고등학교는 특수 목적 고등학교 선택 과목에 한하여 초과 이수할 수 있다.</div>
<div class="rule"><span class="rn">⑪</span>학교에서 개설하지 않은 선택 과목 이수를 희망하는 학생이 있을 경우 그 과목을 개설한 다른 학교에서의 이수를 인정한다.</div>
<div class="rule"><span class="rn">⑫</span>학교 및 학생의 필요에 따라 지역사회의 기관에서 이루어진 학교 밖 교육을 과목 또는 창의적 체험활동으로 이수할 수 있다. 이 경우 <ins class="upd" data-old="충청남도교육청 「일반고 학교 밖 교육 운영 지침」에 따른다." data-why="2027 지침 제3장 3. 가. 8) 다): ‘충청남도교육청 학교 밖 교육 운영 지침’으로 명칭 변경">‘충청남도교육청 학교 밖 교육 운영 지침’에 따른다.</ins></div>
<div class="rule"><span class="rn">⑬</span>학교는 필요에 따라 대학 과목 선이수제의 과목을 개설할 수 있고, 국제적으로 공인된 교육과정이나 과목을 개설할 수 있다.<ins class="upd" data-old="(해당 문장 없음)" data-why="2027 지침 제3장 3. 가. 8) 라): 개설 절차 명시"> 이 경우 「충남 참학력 고등학교 교육과정 편성·운영 지침」 제5장 ‘과목 신설/사용 승인’에 따른다.</ins></div>
<p class="exp">대학 과목 선이수제는 대학에서 배울 과목을 고등학교에서 배운 뒤 대학에서 학점을 인정받는 제도로서, 국내 5개 과학기술특성화대학(KAIST, GIST, DGIST, UNIST, POSTECH)이 공동 AP(Advanced Placement) 교육과정을 개발하여 과학계열 고등학교(영재학교 포함)를 중심으로 도입·운영하고 있다. 고등학교에서 이 과목을 이수하고 일정 수준 이상 도달한 경우 과학기술특성화대학에 입학했을 때 학점으로 인정받을 수 있다. 미국의 AP(Advanced Placement)와 같은 국제적으로 공인받은 교육과정의 과목을 우리나라 고등학교에서 개설할 수 있다.</p>
<div class="rule"><span class="rn">⑭</span>학교는 학생이 교과 및 창의적 체험활동의 이수 기준을 충족한 경우 학점 취득을 인정한다. 이수 기준은 <ins class="upd" data-old="출석률과 학업성취율을 반영하여 설정하며," data-why="2027 지침 제3장 3. 가. 10): 이수 기준 설정 방식 변경">출석률, 학업성취율 중 하나 이상을 반영하되, 교육 활동 및 학습자 특성을 고려하여 설정한다.</ins> 이와 관련된 구체적인 사항은 교육부 장관이 정하는 지침에 따른다.</div>
<div class="rule"><span class="rn">⑮</span>학교는 과목별 최소 성취수준을 보장하기 위해 학교의 여건 등을 고려하여 다양한 방식으로 예방·보충 지도를 실시한다.</div>
<p class="exp">최소 성취수준을 보장하기 위해 예방 지도와 보충 지도를 실시하여야 한다. 미도달 예상 학생을 대상으로 수업 중 지도나 방과 후 기초학력 보장 프로그램 등을 예방 지도로 활용할 수 있다. 이러한 예방 지도에도 불구하고 학기 말에 미이수 과목이 있는 학생은 보충 지도를 통해서 학점을 취득할 수 있다. 보충 지도는 방과 후 또는 방학 중 보충 학습, 과제 부여 등 다양한 방식으로 운영한다.</p>

<h3>가. 일반 고등학교(자율 고등학교 포함)</h3>
<div class="rule"><span class="rn">①</span>교과(군) 174학점 중 필수 이수 학점은 84학점으로 한다. 단, 필요한 경우 학교는 학생의 진로 및 발달 수준 등을 고려하여 필수 이수 학점 수를 학생별로 다르게 정할 수 있다. 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다.</div>
<p class="exp">학교는 기초학력 보충 교육, 대안 교육, 특수교육 대상 학생 등 특별한 경우에 한하여 학생별로 교과(군)별 필수 이수 학점을 감함으로써 필수 이수 학점을 다르게 정할 수 있다. 이러한 경우라도 <ins class="upd" data-old="체육·예술 및 생활·교양 교과 영역의 필수 이수 단위를 감하여 편성·운영할 수 없다." data-why="2015 개정 교육과정(단위제) 표현. 2027 지침에서 2024 입학생 조항이 삭제되어, Ⅳ장 공통 Q36의 2022 개정 기준으로 정리 — 내용 검토 필요">‘한국사1·2’, ‘과학탐구실험1·2’, 체육 교과, 예술 교과(군), 기술·가정/정보/제2외국어/한문/교양 교과(군)의 필수 이수 학점은 감하여 편성·운영할 수 없다.</ins></p>
<p class="exp">학생 개개인의 진로 및 발달 수준 등에 따른 필요를 고려하지 않고 재학생 전체를 대상으로 하여 필수 이수 학점을 조정하지 않도록 해야 한다.</p>
<div class="rule"><span class="rn">②</span>학교는 교육과정을 보통 교과(공통 과목, 일반 선택 과목, 진로 선택 과목, 융합 선택 과목) 중심으로 편성하되, 필요에 따라 전문 교과의 과목을 개설할 수 있다. 이 경우 진로 선택 과목으로 편성한다.</div>
<div class="rule"><span class="rn">③</span>학교가 제2외국어 과목을 개설할 경우, 2개 이상의 과목을 동시에 개설하도록 노력해야 한다.</div>
<div class="rule"><span class="rn">④</span>학교는 필요에 따라 이 교육과정에 제시되어 있는 과목 외에 새로운 과목을 개설할 수 있으며, 이 경우 진로 선택 과목 또는 융합 선택 과목으로 편성한다.</div>
<p class="exp">학교가 필요에 따라 국가 교육과정에 제시된 과목 외의 새로운 과목(고시 외 과목)을 개설할 경우 개설할 과목의 성격에 따라 진로 선택 과목 또는 융합 선택 과목으로 편성한다. 교과별 심화 학습 및 진로 관련 과목은 진로 선택 과목으로, 교과 내·교과 간 주제 융합 과목과 실생활 체험 및 응용을 위한 과목이면 융합 선택 과목으로 편성한다. 고시 외 과목의 기본 학점 및 증감 범위는 보통 교과의 교과(군)에 따른 기본 학점 및 증감 범위를 준용한다.</p>
<p class="ref">2022 개정 교육과정 교육감 승인 과목(고시외 과목) 개설 길라잡이 참고<br>내려받기 주소 : [충남교육청 교육과정·자유학기제] - [2022 개정 교육과정] - [자료실]</p>
<div class="rule"><span class="rn">⑤</span><ins class="upd" data-old="학교는 교육과정을 특성화하기 위해 특정 교과를 중심으로 중점학교를 운영할 수 있다. 이 경우 자율 이수 학점의 30% 이상을 해당 교과(군)의 과목으로 편성하도록 권장한다." data-why="2027 지침 제3장 3. 나. 5) 문구 반영">특정 교과를 중심으로 교과중점학교를 운영할 수 있으며, 교과중점학교는 자율 이수 학점의 30%(27학점) 이상을 해당 교과목으로 편성할 수 있다.</ins></div>
<p class="exp">교과 중점(교과 특성화) 학교는 예술, 체육, 과학, 사회, 정보 등과 같은 특정 교과를 중심으로 특색 있는 교육과정을 운영하는 학교로 자율 이수 학점(90학점)의 30% 이상(27학점 이상)을 해당 교과(군)의 과목으로 집중 편성·운영을 권장한다.</p>
<div class="rule"><span class="rn">⑥</span>학교는 직업교육 관련 학과를 설치·운영하거나 직업 위탁 과정을 운영할 수 있다. 이와 관련된 구체적인 사항은 국가직무능력표준(NCS) 기반 교육과정을 참조하여 학교교육과정위원회 검토와 학교운영위원회 심의를 거쳐 학교장이 정한다. 또한, 직업에 관한 과정을 2년 이상 운영하는 경우에는 특성화 고등학교와 산업수요 맞춤형 고등학교의 학점 배당 기준을 적용할 수 있다.</div>

<h3>나. 특수 목적 고등학교</h3>
<div class="rule"><span class="rn">①</span>교과(군) 174학점 중 필수 이수 학점은 75학점으로 하고, 자율 이수 학점 중 68학점 이상을 특수 목적 고등학교 전공 관련 선택 과목으로 편성한다.</div>
<p class="exp">특수 목적 고등학교에서의 교과(군)별 필수 이수 학점은 국어, 수학, 영어, 사회 교과(군)에서 각각 8학점, 한국사에서 6학점, 과학 교과(군)에서 10학점, 체육 교과(군)에서 10학점, 예술 교과(군)에서 5학점, 기술·가정/정보/제2외국어/한문/교양(군)에서 12학점이다.</p>
<p class="exp">특수 목적 고등학교에서는 해당 계열의 전문 교육을 충실히 수행하기 위해 특수 목적 고등학교 전공 관련 선택 과목을 68학점 이상 편성·운영해야 한다.</p>
<div class="rule"><span class="rn">②</span>외국어·국제 계열 고등학교에서 외국어 관련 전공은 2개 외국어를 포함한 외국어·국제 계열 과목으로 68학점 이상을 편성하되, 전공 외국어 과목을 60% 이상 이수하도록 한다. 국제 관련 전공은 외국어·국제 계열 과목으로 68학점 이상을 편성하되, 사회(역사/도덕 포함) 교과(군)의 과목을 50% 이상 이수하도록 한다.</div>
<div class="rule"><span class="rn">③</span>이 교육과정에 제시되지 않은 계열의 교육과정은 유사 계열의 교육과정에 준한다. 부득이 새로운 계열을 설치하고 그에 따른 교육과정을 편성할 경우에는 <ins class="upd" data-old="충청남도교육청 「고등학교 교육과정 편성·운영 지침」에 따른다." data-why="2027 지침 제3장 3. 다. 3): 해당 절차(제5장) 명시">「충남 참학력 고등학교 교육과정 편성·운영 지침」 제5장 ‘계열·교과(군) 신설 승인’에 따른다.</ins></div>
<div class="rule"><span class="rn">④</span>학교는 필요에 따라 전문 교과의 과목을 개설할 수 있다. 이 경우 진로 선택 과목으로 편성한다.</div>
<p class="exp">학교가 필요에 따라 특성화 고등학교 및 산업수요 맞춤형 고등학교에서 주로 운영하는 전문 교과를 개설할 경우 진로 선택 과목으로 편성한다. 이때 과목의 성격에 따라 해당 계열의 전문 교육을 충실히 수행하기 위한 전공 관련 교과의 경우 특수 목적 고등학교 전공 관련 선택 과목으로 편성할 수 있다.</p>
<div class="rule"><span class="rn">⑤</span>학교가 필요에 따라 이 교육과정에 제시되어 있는 과목 외에 새로운 과목을 개설할 경우 진로 선택 과목 또는 융합 선택 과목으로 편성한다.</div>
<p class="exp">교과별 심화 학습 및 진로 관련 과목은 진로 선택 과목으로, 교과 내·교과 간 주제 융합 과목과 실생활 체험 및 응용을 위한 과목이면 융합 선택 과목으로 편성한다.</p>

<div class="rule"><span class="rn">①</span>1학점은 50분을 기준으로 하여 16회를 이수하는 수업량이다.</div>
<p class="exp">1학점 수업량이 17회에서 16회로 변경되었지만 수업일수는 기존의 190일 이상이 유지되기 때문에 학교에서는 학사 운영 방안을 적절하게 수립해야 한다.</p>
<div class="rule"><span class="rn">②</span>1시간의 수업은 50분을 원칙으로 하되, 기후 및 계절, 학생의 발달 정도, 학습 내용의 성격, 학교 실정을 고려하여 탄력적으로 편성·운영할 수 있다.</div>
<p class="exp">50분보다 적게 운영할 경우 감축된 시간은 보충하는 것이 원칙이다.</p>
<div class="rule"><span class="rn">③</span>공통 과목의 기본 학점은 4학점이며, 1학점 범위 내에서 감하여 편성·운영할 수 있다. 단, 한국사1, 2의 기본 학점은 3학점이며 감하여 편성·운영할 수 없다.</div>
<p class="exp">공통 과목을 ‘공통 과목1, 공통 과목2’로 구성하여 학기 단위 과목 편성·운영이 가능하도록 하였다.</p>
<p class="exp">공통 과목은 기본 학점에서 1학점 감하여 편성·운영 가능하나 증배하여 편성·운영할 수 없다.</p>
<p class="exp">‘한국사1, 한국사2’의 경우 공통 과목이므로 증배하여 편성할 수 없고, 동시에 감하여 편성·운영할 수 없는 기준에 의해 3학점으로만 편성·운영해야 한다.</p>
<div class="rule"><span class="rn">④</span>필수 이수 학점 수는 해당 교과(군)의 최소 이수 학점이다.</div>
<div class="rule"><span class="rn">⑤</span>자연 현장 실습 등 체험 위주의 교육을 전문적으로 실시하는 특성화 고등학교의 전문 교과 필수 이수 학점은 60학점 이상으로 한다.</div>
<p class="exp">그동안 ‘특정 분야의 인재 양성을 목적으로 하는’ 특성화 고등학교 중심으로 교육과정 기준을 제시하였지만, 2022 개정 교육과정에서는 법령에 제시된 ‘자연 현장 실습 등 체험 위주의 교육을 전문적으로 실시하는’ 특성화 고등학교에 대해서도 교육과정 기준을 별도의 항목으로 제시하고 있다.</p>
<p class="ref">※ 해당 학교: 비전고등학교</p>
<div class="rule"><span class="rn">⑥</span>창의적 체험활동의 학점 수는 최소 이수 학점이며 (&nbsp;&nbsp;)안의 숫자는 이수 학점을 시간 수로 환산한 것이다.</div>
<p class="exp">괄호 안의 숫자는 이수 학점 18학점을 학점당 16시간으로 환산하여 3년간 이수해야 할 최소 이수 시간 수이다.</p>
<p class="exp">이수 학점 수를 시간 수로 환산하여 제시한 것은 창의적 체험활동의 영역이나 하위 활동 시수를 배정할 때, 학점 수에 얽매이지 않고 시간 수를 고려하여 학교가 자율적으로 편성·운영할 수 있도록 하기 위한 것이다.</p>
<div class="rule"><span class="rn">⑦</span>총 이수 학점 수는 고등학교 졸업을 위해 3년간 이수해야 할 최소 이수 학점을 의미한다.</div>
<p class="exp">학교에서는 학생이 최소 192학점을 이수할 수 있도록 교육과정을 편성·운영해야 한다. 학교에서는 「초·중등교육법 시행령」 제92조의3에 의거하여 국가 교육과정의 범위에서 졸업의 기준을 학칙으로 정해야 한다.</p>
<p class="exp">2022 개정 교육과정에서는 ‘고등학교 졸업을 위해’라는 말이 추가되었다. 이는 고교학점제 기반의 고등학교 교육과정 특성을 보여 주는 것으로 192학점 이상을 이수해야 고등학교를 졸업할 수 있다는 것을 의미한다.</p>
<div class="rule"><span class="rn">⑧</span>과목의 이수 시기와 학점은 학교에서 자율적으로 편성·운영한다.
<ul class="dash"><li>공통 과목은 해당 교과(군)의 선택 과목 이수 전에 편성·운영하는 것을 원칙으로 한다.</li><li>학생의 발달 수준 등을 고려하여 공통수학1, 2와 공통영어1, 2를 기본수학1, 2와 기본영어1, 2로 대체하여 이수하도록 편성·운영할 수 있다.</li><li>선택 과목 중에서 위계성을 갖는 과목의 경우, 계열적 학습이 가능하도록 편성한다. 단, 학교의 실정 및 학생의 요구, 과목의 성격에 따라 탄력적으로 편성·운영할 수 있다.</li></ul></div>
<p class="exp">직무 의사소통, 직무 수학, 직무 영어를 해당 교과(군)의 공통 과목 이수 전에 편성·운영할 수 없다.</p>
<p class="exp">학생의 발달 상황과 학습 수준에 맞추어 공통 과목 또는 기본 과목을 대체 이수할 수 있도록 개설하므로 ‘기본수학1’을 수강한 학생이 ‘공통수학2’를 수강할 수 있다. 단 ‘기본수학1’은 ‘공통수학1’을 대체하고, ‘기본수학2’는 ‘공통수학2’를 대체하므로 ‘기본수학1’과 ‘공통수학1’을 이수한 것으로 필수 이수 학점을 충족시킬 수는 없다.</p>
<p class="exp">위계성이 명확한 과목은 대체로 Ⅰ과 Ⅱ로 표기하고 있다. 다만, 선택 과목을 편성하는 경우 학생이 과목을 이수하는 데에 무리가 없도록 보통 교과의 관련 선택 과목을 먼저 이수하도록 학교 교육과정을 편성하는 것이 바람직하다.</p>
<p class="exp">전문 교과 중 전공 실무 과목은 능력단위 기준으로 평가하는 상황을 고려하여 하나의 능력단위를 다음 학기에 이어서 평가하지 않는다는 전제하에 최대 2학기에 걸쳐 편성·운영할 수 있다.</p>
<div class="rule"><span class="rn">⑨</span>학교는 학생의 필요와 학업 부담을 고려하여 교과(군) 총 이수 학점을 초과 이수하는 학점이 적정화되도록 하며, 특성화 고등학교 및 산업수요 맞춤형 고등학교는 전문 교과의 과목에 한하여 초과 이수할 수 있다.</div>
<div class="rule"><span class="rn">⑩</span>학교는 일정 규모 이상의 학생이 이 교육과정에 제시된 선택 과목의 개설을 요청할 경우 해당 과목을 개설해야 한다.</div>
<div class="rule"><span class="rn">⑪</span>학교에서 개설하지 않은 선택 과목 이수를 희망하는 학생이 있을 경우 그 과목을 개설한 다른 학교에서의 이수를 인정한다.</div>
<div class="rule"><span class="rn">⑫</span>학교는 필요에 따라 이 교육과정에 제시되어 있는 과목 외에 새로운 과목을 개설할 수 있다.</div>
<p class="exp">고시 외 과목의 기본 학점 및 증감 범위는 전문 교과의 교과(군)에 따른 기본 학점 및 증감 범위를 준용한다.</p>
<p class="ref">2022 개정 교육과정 교육감 승인 과목(고시외 과목) 개설 길라잡이 참고<br>내려받기 주소 : [충남교육청 교육과정·자유학기제] - [2022 개정 교육과정] - [자료실]</p>
<div class="rule"><span class="rn">⑬</span>학교 및 학생의 필요에 따라 지역사회의 기관에서 이루어진 학교 밖 교육을 과목 또는 창의적 체험활동으로 이수할 수 있다. 이 경우 <ins class="upd" data-old="충청남도교육청 「충남 직업계고 학교 밖 교육 추진 계획」에 따른다." data-why="2027 지침 제3장 3. 가. 8) 다): ‘충청남도교육청 학교 밖 교육 운영 지침’에 따름 — 직업계고 별도 계획 존속 여부 확인 필요">‘충청남도교육청 학교 밖 교육 운영 지침’에 따른다.</ins></div>
<div class="rule"><span class="rn">⑭</span>학교는 학생이 교과 및 창의적 체험활동의 이수기준을 충족한 경우 학점 취득을 인정한다. 이수기준은 <ins class="upd" data-old="출석률과 학업성취율을 반영하여 설정하며," data-why="2027 지침 제3장 3. 가. 10): 이수 기준 설정 방식 변경">출석률, 학업성취율 중 하나 이상을 반영하되, 교육 활동 및 학습자 특성을 고려하여 설정한다.</ins> 이와 관련된 구체적인 사항은 교육부 장관이 정하는 지침에 따른다.</div>
<div class="rule"><span class="rn">⑮</span>학교는 과목별 최소 성취수준을 보장하기 위해 학교의 여건 등을 고려하여 다양한 방식으로 예방·보충지도를 실시한다.</div>
<p class="exp">최소 성취수준을 보장하기 위해 예방 지도와 보충 지도를 실시하여야 한다. 미도달 예상 학생을 대상으로 수업 중 지도나 방과 후 기초학력 보장 프로그램 등을 예방 지도로 활용할 수 있다. 이러한 예방 지도에도 불구하고 학기 말에 미이수 과목이 있는 학생은 보충 지도를 통해서 학점을 취득할 수 있다. 보충 지도는 방과 후 또는 방학 중 보충 학습, 과제 부여 등 다양한 방식으로 운영한다.</p>
<div class="rule"><span class="rn">⑯</span>학교는 교과(군)의 총 이수 학점 174학점 중 <ins class="upd" data-old="보통 교과를 64학점, 전문 교과의 필수 이수 학점은 80학점으로 한다. 단, 필요한 경우 학교는 학생의 진로 및 발달 수준 등을 고려하여 필수 이수 학점 수를 학생별로 다르게 정할 수 있다. 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다." data-why="2027 지침 제3장 3. 라. 1) 가): 심의 절차 문구(교과협의회 제외) 반영">보통 교과의 필수 이수 학점은 64학점, 전문 교과의 필수 이수 학점은 80학점으로 한다. 단, 필요한 경우 학교는 학생의 진로 및 발달 수준 등을 고려하여 필수 이수 학점을 학생별로 다르게 정할 수 있으며, 이 경우 학교교육과정위원회 검토와 학교운영위원회 심의를 거쳐 학교장이 정한다.</ins></div>
<p class="exp">특성화고등학교와 산업수요 맞춤형 고등학교에서는 학생의 진로·적성, 학습 수준에 따른 탄력적 맞춤형 교육을 제공하고자 학생별로 필수 이수 학점을 다르게 편성할 수 있다. 즉 학교는 기초학력 보충교육, 예술·체육·대안 교육이 필요한 학생 등 특별한 경우에 한하여 학생별로 교과(군)별 필수 이수 학점을 감함으로써 필수 이수 학점(보통교과 64학점)을 다르게 정할 수 있다.</p>
<p class="exp">학생 개개인의 진로 및 발달 수준 등에 따른 필요를 고려하지 않고 재학생 전체를 대상으로 하여 필수 이수 학점을 조정하지 않도록 해야 한다.</p>
<div class="rule"><span class="rn">⑰</span>학교는 두 개 이상의 교과(군)의 과목을 선택하여 전문 교과를 편성·운영할 수 있다.</div>
<p class="exp">학교는 학과별로 특정 교과(군)에만 국한하여 과목을 선택하기보다는 인력 양성 유형 등에 따라 다른 교과(군)의 전공 일반 과목이나 전공 실무 과목을 선택하여 교육과정을 편성·운영할 수 있다.</p>
<div class="rule"><span class="rn">⑱</span>전공 실무 과목은 국가직무능력표준의 성취기준에 적합하게 교수·학습이 이루어지도록 하며, 내용 영역인 능력단위 기준으로 평가한다.</div>
<div class="rule"><span class="rn">⑲</span>학교는 학과를 운영할 때 필요한 경우 세부 전공, 부전공 또는 자격 취득 과정<ins class="upd" data-old="을 개설할 수 있다." data-why="2027 지침 제3장 3. 라. 2): 자격취득과정 능력단위 안내 의무, 부전공 인정 기준 추가">별로 전문 교과를 개설할 수 있으며, 자격취득과정을 편성·운영할 경우 실무 과목의 필수·선택 능력단위별 최소 교육 훈련 시간에 준하여 이수해야 할 능력단위를 편성하여 안내해야 한다. 단, 타 학과 과목을 24학점 이상 이수할 경우에는 부전공으로 인정할 수 있다.</ins></div>
<p class="exp">세부 전공 과정은 학과별 인력 양성 유형을 기반으로 연계된 자격이나 직무에 따라 세분화된 교육과정으로 통상 운영하던 전공 코스제를 의미한다.</p>
<p class="exp">부전공 과정은 다기능 창의·융합형 기술인재 양성을 위해 소속 학과 외 타 학과 전공 과정의 과목을 일정 기준 이상(24학점 이상) 선택·수강하여 부전공으로 인정받을 수 있는 학과 간 융합 교육과정을 의미한다. 별도의 융복합 학과로의 개편 및 학생의 전과 없이도 소속 학과의 전공 과정과 타 학과 과정 이수를 통해 학생의 과목 선택권 확대 및 산업 현장에서 요구하는 맞춤형 교육과정을 운영할 수도 있다.</p>
<p class="exp">자격 취득 과정은 학과의 인력 양성 유형과 연계된 자격(과정형 자격과 검정형 자격을 모두 포함) 취득을 위한 과정으로 자격에서 요구하는 과목 및 능력단위를 중심으로 교육과정을 편성·운영하는 것을 말한다.</p>
<div class="rule"><span class="rn">⑳</span>전문 교과의 기초가 되는 과목을 선택하여 이수할 경우, 이와 관련되는 보통 교과의 선택 과목 이수로 간주할 수 있다.</div>
<p class="exp">전문 교과의 기초가 되는 과목은 전문 공통 과목, 전공 일반 과목을 의미한다.</p>
<p class="exp">학교는 전문 교과의 ‘성공적인 직업 생활’ 등 전문 공통 과목과 ‘창업 일반’, ‘기계 일반’ 등의 전공 일반 과목을 보통 교과의 기술·가정/정보 교과(군) 선택 과목(일반 선택, 진로 선택, 융합 선택) 이수로 간주할 수 있다.</p>
<p class="exp">이 경우 다음 사항에 유의해야 한다. 첫째, 전문 교과의 기초가 되는 과목을 보통 교과의 선택 과목으로 대체하여 편성하는 경우, 과목의 학점 수 및 성적 산출 방식은 보통 교과 선택 과목의 학점 수 및 성적 산출 방식을 따른다. 둘째, 전문 교과의 기초가 되는 과목은 대체되는 보통 교과의 선택 과목과 성격이 유사해야 한다. 한편, 여기에서 관련되는 보통 교과의 선택 과목은 일반 선택 과목, 진로 선택 과목 그리고 융합 선택 과목 모두를 의미한다.</p>
<p class="exp">단, 교양 과목으로 대체하여 편성하는 것은 불가능하다.</p>
<p class="ref warn">편성 불가 예시: 성공적인 직업생활을 교양 교과(군)의 진로와 직업 대체 과목으로 편성</p>
<div class="rule"><span class="rn">㉑</span>내용이 유사하거나 관련되는 보통 교과의 선택 과목과 전문 교과의 과목을 교체하여 편성·운영할 수 있다.</div>
<p class="exp">학교는 해당 분야의 기초적인 이해를 돕기 위해 기술·가정/정보 교과의 ‘기술·가정’, ‘정보’, ‘로봇과 공학세계’, ‘생활과학 탐구’, ‘창의 공학 설계’, ‘지식 재산 일반’, ‘생애 설계와 자립’, ‘인공지능 기초’, ‘데이터 과학’ 등의 선택 과목을 전문 교과로 편성할 수 있으며, 전문 교과에는 편성되어 있지 않은 보통 교과의 ‘영상 제작의 이해’, ‘드로잉’ 등과 같은 진로 선택 과목들도 전문 교과로 편성·운영할 수 있다.</p>
<div class="rule"><span class="rn">㉒</span>학교는 산업계의 수요 등을 고려하여 전문 교과의 교과 내용에 주제나 내용 요소를 추가하여 구성할 수 있다. 단, 전공 실무 과목의 경우에는 국가직무능력표준에 기반을 두어야 하며, 학교 및 학생의 필요에 따라 내용 영역(능력단위) 중 일부를 선택하여 운영할 수 있다.</div>
<div class="rule"><span class="rn">㉓</span>다양한 직업적 체험과 현장 적응력 제고 등을 위해 학교에서 배운 지식과 기술을 경험하고 적용하는 현장 실습을 교육과정에 포함하여 운영한다.<ins class="upd" data-old="(해당 내용 없음)" data-why="2027 지침 제3장 3. 라. 6) 가)·나) 반영">
<ul class="dash"><li>현장 실습은 교육과정과 관련된 직무를 경험할 수 있도록 운영한다. 특히, 산업체를 기반으로 실시하는 현장 실습은 학생이 참여 여부를 선택하도록 하되, 학교와 산업계가 현장 실습 프로그램을 공동으로 개발하고 현장 실습의 과정과 결과를 평가하도록 한다.</li><li>현장 실습은 지역사회 기관들과 연계하여 다양한 형태로 운영할 수 있으며, 이와 관련된 구체적인 사항은 ‘충청남도교육청 현장실습 운영 지침’에 따른다.</li></ul></ins></div>
<p class="exp">현장 실습은 교내 활동과 교외 활동으로 구분하고 있으며 교내 활동 유형에는 교내 현장 실습(산업 현장 전문가 학교 방문 교육 등), 교외 활동 유형에는 산업체 체험형 현장 실습, 연계교육형 현장 실습, 산업체 채용형 현장 실습으로 구분하고 있다.</p>
<div class="rule"><span class="rn">㉔</span>학교가 필요에 따라 이 교육과정에 제시되어 있는 과목 외에 새로운 전공 실무 과목을 개설하여 운영할 경우 국가직무능력표준에 기반을 두어야 한다.<ins class="upd" data-old="(해당 문장 없음)" data-why="2027 지침 제3장 3. 라. 10): 개설 절차 명시"> 이 경우 「충남 참학력 고등학교 교육과정 편성·운영 지침」 제5장 ‘과목 신설/사용 승인’에 따른다.</ins></div>
</template>
<template id="tpl-s3-3" data-sec data-ch="3" data-title="3. 특수한 학교" data-pages="39">
<div class="rule"><span class="rn">①</span>고등학교에 준하는 학교의 교육과정은 이 지침에 따라서 편성·운영한다.</div>
<div class="rule"><span class="rn">②</span>국가가 설립 운영하는 학교의 교육과정은 이 지침을 참고하여 학교장이 편성한다.</div>
<div class="rule"><span class="rn">③</span>고등기술학교, 근로 청소년을 위한 특별 학급 및 산업체 부설 학교, 기타 특수한 학교는 이 교육과정을 바탕으로 학교의 실정과 학생의 특성에 알맞은 학교교육과정을 편성하고, 교육감의 승인을 얻어 운영한다.</div>
<div class="rule"><span class="rn">④</span>야간 수업을 하는 학교의 교육과정은 이 교육과정을 따르되, 다만 1시간의 수업을 40분으로 단축하여 운영할 수 있다.</div>
<div class="rule"><span class="rn">⑤</span>방송통신고등학교는 이 교육과정에 제시된 교육과정을 따르되, 교육감의 승인을 얻어 이 교육과정의 편제와 시간·학점 배당 기준을 다음과 같이 조정하여 운영할 수 있다.</div>
<p class="exp">편제와 시간·학점 배당 기준은 고등학교 교육과정에 준하되, 152학점 이상 이수하도록 한다.</p>
<p class="exp">학교 출석 수업 일수는 연간 20일 이상으로 한다.</p>
<div class="rule"><span class="rn">⑥</span>특성화 학교, 자율 학교, 재외한국학교 등 법령에 따라 교육과정 편성·운영의 자율성이 부여되는 학교의 경우에는 학교의 설립 목적 및 특성에 따른 교육이 가능하도록 교육과정 편성·운영의 자율권을 부여하고, 이와 관련한 구체적인 사항은 교육감(재외한국학교의 경우 교육부)이 정하는 지침에 따른다.</div>
<div class="rule"><span class="rn">⑦</span>교육과정의 연구 등을 위해 새로운 방식으로 교육과정을 편성·운영하고자 하는 학교는 교육부 장관의 승인을 받아 이 교육과정의 기준과는 다르게 학교 교육과정을 편성·운영할 수 있다.</div>
</template>

<template id="tpl-s5-2" data-sec data-ch="5" data-title="2. 교육과정 편성 자체 점검표(공통)" data-pages="76-78">
<div class="checklist" data-key="common">
<div class="ck"><p>학생의 과목 선택권이 실질적으로 보장되도록 편성하였는가?</p><ul class="dash"><li>학생의 진로와 적성을 고려한 다양한 과목 선택이 가능하도록 교육과정을 편성하였는가?</li><li>학교의 지정 과목의 이수 학점이 필수 이수 학점을 초과하지 않도록 편성하였는가?</li><li>다양한 교과(군)을 통합한 선택 그룹으로 편성하고 있는가?</li><li>각 선택 그룹 내 편제된 과목의 수를 최소화하여 선택 그룹의 수를 과도하게 편성하고 있지 않는가?</li></ul></div>

<div class="ck"><p>창의적 체험활동의 최소 이수 시수를 3개년 18학점(288시간) 이상 편성하였는가?</p></div>
<div class="ck"><p>3개 영역(자율·자치 활동, 동아리 활동, 진로 활동)을 누락 없이 편성하였는가?</p></div>
<div class="ck"><p>봉사활동 성격의 프로그램을 자율·자치 혹은 동아리 활동에 포함하여 편성하였는가?</p></div>

<script type="application/json" id="faq-data">{"com01": {"grp": "com", "num": "01", "sub": "1) 교육과정 편성", "title": "학기별 이수 학점은 균등하게 편성해야 하나요?", "page": 51, "body": "<p>모든 학기의 이수 학점이 동일해야 하는 것은 아닙니다. 학교의 상황이나 학생 특성에 따라 학기당 이수 학점에 차등을 두어 편성할 수 있습니다. 그러나 특정 학기에 이수 학점이 편중되면 학생들의 학업 부담이 과중할 수 있으므로 학기별 학점의 차이가 최대 5학점 이상 나지 않도록 편성하도록 안내하고 있습니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학업 부담을 적정화하고 의미 있는 학습 활동이 이루어질 수 있도록 학기당 이수 교과목 수를 조정할 수 있다. 학교는 학생의 학업 부담을 완화하고 깊이 있는 학습이 이루어질 수 있도록 학기당 이수하는 학점을 적정하게 편성한다.<\/li><\/ul><\/aside>"}, "com02": {"grp": "com", "num": "02", "sub": "1) 교육과정 편성", "title": "공통 과목을 편성하기 전에 선택 과목을 편성하는 것이 가능한가요?", "page": 51, "body": "<p>공통 과목은 해당교과(군)의 선택 과목 이수 전에 편성하는 것이 원칙입니다. 공통 과목은 해당 교과(군)의 기초 소양 및 기본 학력 함양과 학문의 기본 이해를 위한 과목이고 선택 과목은 교과별 학문 영역 내의 주요 학습 내용의 이해와 탐구, 적성과 진로에 맞는 맞춤형 학습, 교과 내·교과 간 융합학습이 가능하도록 설계된 과목입니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>과목의 이수 시기와 학점은 학교에서 자율적으로 편성·운영하되, 다음의 각호를 따른다. (중략) 공통 과목은 해당 교과(군)의 선택 과목 이수 전에 편성·운영하는 것을 원칙으로 한다.<\/li><\/ul><\/aside>"}, "com03": {"grp": "com", "num": "03", "sub": "1) 교육과정 편성", "title": "공통 과목 1과 2 사이에도 위계가 있나요?", "page": 51, "body": "<p>2022 개정 교육과정에서는 과목 간 위계를 Ⅰ·Ⅱ로 표시하고 있습니다. 따라서, 이에 해당하지 않는 공통 과목 1과 2 사이에 위계가 있다고 보기 어렵습니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설 고등학교<\/h6><ul><li>2022 개정 교육과정에서 위계성이 명확한 과목은 대체로 Ⅰ과 Ⅱ로 표기하고 있다<\/li><\/ul><\/aside>"}, "com04": {"grp": "com", "num": "04", "sub": "1) 교육과정 편성", "title": "1학년 1학기에 ‘공통수학1’을 이수한 학생이 2학기에 ‘기본수학2’를 이수하는 것이 가능한가요?", "page": 52, "body": "<p>2022 개정 교육과정에서는 수학과 영어의 경우 학생별 상황과 학업 수준 등을 고려하여 공통과목인 ‘공통수학1·2’와 ‘공통영어1·2’의 대체 이수가 가능한 ‘기본수학1·2’와 ‘기본영어1·2’를 편제하였습니다. ‘기본수학1’은 ‘공통수학1’을, ‘기본수학2’는 ‘공통수학2’를 각각 대체하므로 1학년 1학기에 ‘공통수학1’을 이수한 학생도 2학기에 ‘기본수학2’를 대체 이수하는 것이 가능합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>과목의 이수 시기와 학점은 학교에서 자율적으로 편성·운영하되, 다음의 각호를 따른다. (중략) 학생의 발달 수준 등을 고려하여 공통수학1, 2와 공통영어1, 2를 기본수학1, 2와 기본영어1, 2로 대체하여 이수하도록 편성·운영할 수 있다. 이 경우 교과협의회와 학교교육과정위원회 검토, 학교운영위원회 심의를 거쳐 학교장이 정한다.<\/li><\/ul><\/aside>"}, "com05": {"grp": "com", "num": "05", "sub": "1) 교육과정 편성", "title": "‘한국사1’과 ‘한국사2’를 1학년이 아닌 다른 학년에 편성하는 것이 가능한가요?", "page": 52, "body": "<p>2015 개정 교육과정에서 ‘한국사’는 기초 교과 영역에 편제되어 있어 사회(역사/도덕 포함) 교과군의 역사 선택 과목과 이수 순서 상관없이 편성·운영하는 것이 가능했지만, 2022 개정 교육과정에서는 ‘한국사1·2’가 사회(역사/도덕포함)교과군에 편제되어 있으므로 역사 관련 선택 과목을 이수하기 위해서는 공통 과목 ‘한국사1·2’를 이수해야 합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>한국사는 2015 개정 교육과정에서 기초 영역에 편제되어 있어서 사회(역사/도덕 포함) 교과군 내 역사 관련 선택 과목과 순서 상관없이 편성·운영할 수 있었으나 2022 개정 교육과정에서는 한국사가 사회(역사/도덕 포함) 교과군에 편제되어 있어 공통 과목인 한국사를 먼저 편성한 후 역사 관련 선택 과목(‘세계사’, ‘동아시아 역사 기행’ 등)을 편성한다.<\/li><\/ul><\/aside>"}, "com06": {"grp": "com", "num": "06", "sub": "1) 교육과정 편성", "title": "‘한국사1’과 ‘한국사2’의 이수 학점을 증감할 수 있나요?", "page": 52, "body": "<p>증감이 불가합니다. ‘한국사1’과 ‘한국사2’는 각각 3학점으로만 편성해야 합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설(교육부 고시 제2022-33호)<\/h6><ul><li>한2022 개정 교육과정에서 학교는 학생이 학기 단위로 과목을 이수하도록 교육과정을 편성·운영해야 한다. 이를 위하여 공통 과목을 ‘공통 과목1, 공통 과목2’로 구성하여 학기 단위 과목 편성·운영이 가능하도록 하였다. 공통 과목은 기본 학점에서 1학점 감하여 편성·운영 가능하나 증배하여 편성·운영할 수 없다. ‘한국사1, 한국사2’의 경우 공통 과목이므로 증배하여 편성할 수 없고, 동시에 감하여 편성·운영할 수 없는 기준에 의해 3학점으로만 편성·운영해야 한다.<\/li><\/ul><\/aside>"}, "com07": {"grp": "com", "num": "07", "sub": "1) 교육과정 편성", "title": "진로 선택 과목이나 융합 선택 과목의 이수 과목 수에 대한 별도 기준이 있나요?", "page": 53, "body": "<p>별도 기준은 없습니다. 2015 개정 교육과정에서는 학생이 졸업 전 진로 선택 과목을 3과목 이상 이수하도록 교육과정을 편성해야 했습니다. 그러나 2022 개정 교육과정에서는 진로 및 융합 선택 과목의 이수 과목 수에 대한 별도 기준을 제시하고 있지 않습니다. 단, 선택 과목의 유형별로 균형 잡힌 이수가 가능하도록 교육과정을 편성해야 합니다.<\/p>\n<aside class=\"cite\"><h6>초·중등학교 교육과정 총론(국가교육위원회 고시 제2024-3호) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>과목의 성격 및 학생의 진로·적성 등을 고려하여 일반 선택 과목, 진로 선택 과목, 융합 선택 과목을 균형 있게 이수할 수 있도록 교육과정을 편성·운영한다.<\/li><\/ul><\/aside>"}, "com08": {"grp": "com", "num": "08", "sub": "1) 교육과정 편성", "title": "일반 선택 과목 이수 전에 진로 선택 과목이나 융합 선택 과목을 이수하는 것이 가능한가요?", "page": 53, "body": "<p>2022 개정 교육과정에서는 선택 과목의 유형에 따른 위계를 제시하고 있지 않습니다. 선택 과목 중에 위계성이 명확한 과목은 Ⅰ과 Ⅱ(미적분Ⅰ → 미적분Ⅱ, 영어Ⅰ → 영어Ⅱ)로 과목명을 표기하고 있습니다. 일반고에서 특수 목적고의 선택 과목을 편성한 경우 보통 교과의 관련 선택 과목을 먼저 이수하도록 교육과정을 편성해야 하는데, 이에 대한 자세한 내용은 교과(군)별 교육과정 각론에서 확인이 가능합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 총론 해설 고등학교<\/h6><ul><li>2022 개정 고등학교 교육과정은 학점 기반 선택 중심 교육과정이기 때문에 기본적으로 단위학교의 실정 및 학생 요구, 과목의 성격 등을 고려하여 자율적으로 과목을 선택하여 편성할 수 있다. 다만, 선택 과목 중에서 위계성을 갖는 과목은 계열적 학습이 가능하도록 편성한다. 2022 개정 교육과정에서 위계성이 명확한 과목은 대체로 Ⅰ과 Ⅱ로 표기하고 있다. 다만, 선택 과목을 편성하는 경우 학생이 과목을 이수하는 데에 무리가 없도록 보통교과의 관련 선택 과목을 먼저 이수하도록 학교 교육과정을 편성하는 것이 바람직하다.<\/li><\/ul><\/aside>"}, "com09": {"grp": "com", "num": "09", "sub": "1) 교육과정 편성", "title": "전문 교과의 과목을 일반 고등학교에서 개설할 때, 교과(군)는 어떻게 결정해야 하고 그 편성 학점의 범위는 어떤 기준에 따라야 하나요?", "page": 53, "body": "<p>일반고는 학교교육과정을 보통교과 중심으로 편성해야 하지만 학교의 여건, 학생의 요구 등에 따라 전문교과 과목을 개설할 수 있습니다. 이 경우에는 과목 교육과정의 성격과 목표, 내용 체계를 바탕으로 교육과정위원회 협의 과정을 통해 교과(군)를 결정해야 합니다. 전문 교과 과목을 일반 고등학교에서 개설할 때, 진로 선택 과목으로 편성해야 하며 과목 기본 학점과 증감 범위는 일반고 보통교과 해당 교과(군)의 기본 학점과 증감 범위를 따릅니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>일반 고등학교는 교육과정을 보통 교과 중심으로 편성하되, 필요에 따라 전문 교과의 과목을 개설할 수 있다. 이 경우 진로 선택 과목으로 편성한다.<\/li><\/ul><\/aside>"}, "com10": {"grp": "com", "num": "10", "sub": "1) 교육과정 편성", "title": "‘기술·가정/정보/제2외국어/한문/교양’ 교과군에서 특정 교과(군)가 포함되지 않도록 학교 교육과정을 편성하는 것이 가능한가요?", "page": 54, "body": "<p>일반고의 ‘기술·가정/정보/제2외국어/한문/교양’교과군의 필수 이수 학점은 16학점 이상(특목고 12학점이상, 특성화고 및 산업 수요 맞춤형 고등학교 8학점이상)입니다. 이에 따라 학교의 상황이나 학생 요구에 따라 특정 교과(군)를 제외하고 나머지 교과(군)만으로 필수 이수 학점을 충족하도록 편성하는 것도 가능합니다. 다만, 학생의 과목 선택 요구가 있는데 학교 여건만을 고려하여 학교 교육과정에서 특정 교과(군)의 과목을 배제하는 것은 바람직하지 않습니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>학교는 일정 규모 이상의 학생이 이 교육과정에 제시된 선택 과목의 개설을 요청할 경우 해당 과목을 개설해야 한다.<\/li><\/ul><\/aside>"}, "com11": {"grp": "com", "num": "11", "sub": "1) 교육과정 편성", "title": "자율형 공립고과 자율형 사립고의 필수 이수 학점 기준은 무엇인가요?", "page": 54, "body": "<p>자율형 공립고·사립고는 학점 배당 기준은 일반 고등학교에 준해서 기준이 적용됩니다. 다만 학교의 교육과정 자율성 보장을 위해 예술 교과군 5학점, 기술·가정/정보/제2외국어/한문/ 교양 교과군 12학점의 기준이 적용됩니다.<\/p>\n<aside class=\"cite\"><h6>초·중등학교 교육과정 총론(국가교육위원회 고시 제2024-3호) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>필수 이수 학점 수는 해당 교과(군)의 최소 이수 학점이다. 특수 목적 고등학교와 자율 고등학교의 경우 예술 교과군은 5학점 이상, 기술·가정/정보/제2외국어/한문/교양 교과군은 12학점 이상 이수하도록 한다.<\/li><\/ul><\/aside>"}, "com12": {"grp": "com", "num": "12", "sub": "1) 교육과정 편성", "title": "동일 과목을 학점을 달리하여 다른 학기에 편성하는 것이 가능한가요?", "page": 54, "body": "<p>동일한 입학연도의 교육과정이 적용된다면 동일과목이 여러 학기에 편성될 때는 동일학점으로 편성해야 합니다. <ins class=\"upd\" data-old=\"다만, 학과별로 학생을 선발한 경우는 동일 과목을 학점 수를 달리하여 편성하는 것이 가능하며,\" data-why=\"2027 지침 예외 범위 한정에 맞춰 답변 보완 — 내용 검토 필요\">다만, 학과별로 학생을 선발한 경우는 해당 학과의 전공 관련 교과(군) 과목에 한하여, 예술·체육 중점학교는 각각 예술·체육 교과(군) 과목에 한하여 학점 수를 달리하여 편성하는 것이 가능하며,<\/ins> 입학 연도가 달라 다른 교육과정이 적용되는 경우도 동일 과목을 학점 수를 달리하여 편성하는 것이 가능합니다.<\/p>\n<aside class=\"cite\"><h6>충남 참학력 고등학교 교육과정 편성·운영 지침<\/h6><ul><li>동일 학년도 입학생에 대해서는 동일 과목을 개설할 경우 이수 학점을 동일하게 편성한다. <ins class=\"upd\" data-old=\"단, 학과별로 학생을 모집·선발한 학교와 예술·체육 중점학교는 예외로 한다.\" data-why=\"2027 지침 제3장 3. 가. 4) 마): 예외 범위 한정\">단, 학과별로 학생을 모집·선발한 학교는 해당 학과의 전공 관련 교과(군)에 한하여, 예술·체육 중점학교는 각각 예술 교과(군) 및 체육 교과(군)에 해당하는 과목에 한하여 예외로 한다.<\/ins><\/li><\/ul><\/aside>"}, "com13": {"grp": "com", "num": "13", "sub": "1) 교육과정 편성", "title": "고시 외 과목의 교과(군)과 과목 유형은 어떻게 편성해야 하나요?", "page": 55, "body": "<p>교육감의 승인을 받은 고시 외 과목은 절차 진행 시 교과(군)와 과목유형(진로 선택 과목 또는 융합 선택 과목)도 승인을 받습니다. 따라서 학교에서 고시 외 과목을 편성할 때는 해당 과목이 어떤 교과(군)와 유형으로 승인을 받았는지 확인해야 합니다. 이에 따라 기본 학점 및 증감 범위도 해당하는 교과(군)의 기준에 따라야 합니다.<\/p>\n<aside class=\"cite\"><h6>2022 개정 교육과정 교육감 승인 과목 개설 길라잡이(충남교육청, 2025.7) <span class=\"chk\" data-why=\"인용 자료의 최신판 확인 필요\">최신판 확인<\/span><\/h6><ul><li>보통교과 예시<figure class=\"scan\"><img alt=\"교과목 신설/사용 승인 신청서 작성 예시(보통교과, 피지컬 컴퓨팅 기반 문제해결)\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQ
